function uploadCardHTML(){
  let cls = "dropzone";
  if(UP.busy) cls += " busy"; else if(UP.done) cls += " done"; else if(UP.err) cls += " error"; else if(UP.pending && !hasKey()) cls += " waiting";
  return '<div class="upload-card"><div class="'+cls+'" id="dropzone">'+dropzoneInner()+'</div>'
    + '<div class="upload-side'+((UP.pending && !hasKey())?' needs-key':'')+'">'+sidePanelHTML()+'</div></div>';
}
function toggleKeyVis(){
  const f=document.getElementById("keyField"), b=document.getElementById("eyeBtn"); if(!f) return;
  const show = f.type==="password"; f.type = show ? "text" : "password"; b.innerHTML = ic(show?"eyeOff":"eye",16);
}

function refreshUploadCard(){
  const host=document.getElementById("uploadHost"); if(!host) return;
  const ev=document.getElementById("evalChk"); const evOn=ev&&ev.checked;
  host.innerHTML=uploadCardHTML();
  const e2=document.getElementById("evalChk"); if(e2&&evOn) e2.checked=true;
  wireDrop();
}
function changeKey(){ UP.changingKey=true; UP.keyErr=""; refreshUploadCard(); const f=document.getElementById("keyField"); if(f) f.focus(); }
function removeKey(){ setKey(""); UP.changingKey=false; UP.keyErr=""; refreshUploadCard(); }

async function saveKey(){
  const f=document.getElementById("keyField"); const k=f?f.value.trim():""; if(!k||UP.checking) return;
  UP.checking=true; UP.keyErr=""; refreshUploadCard();
  try{
    const r=await (await fetch("/api/check-key",{ method:"POST", headers:{ "X-Gemini-Key":k } })).json();
    UP.checking=false;
    if(r.ok){
      setKey(k); UP.changingKey=false; UP.keyErr="";
      const p=UP.pending; UP.pending=null;
      refreshUploadCard();
      if(p) handleFile(p);
    } else { UP.keyErr=r.error||"Key not accepted."; refreshUploadCard(); const g=document.getElementById("keyField"); if(g) g.focus(); }
  }catch(e){ UP.checking=false; UP.keyErr="Could not reach the local server."; refreshUploadCard(); }
}

function pickPdf(){
  if(!API.available){ toast("Upload needs the local server. Run: python server.py  then open http://127.0.0.1:8765"); return; }
  const inp=document.createElement("input"); inp.type="file"; inp.accept="application/pdf,.pdf";
  inp.onchange=function(){ if(inp.files[0]) handleFile(inp.files[0]); };
  inp.click();
}
function wireDrop(){
  const z=document.getElementById("dropzone"); if(!z) return;
  ["dragenter","dragover"].forEach(function(ev){ z.addEventListener(ev,function(e){ e.preventDefault(); z.classList.add("over"); }); });
  ["dragleave","drop"].forEach(function(ev){ z.addEventListener(ev,function(e){ e.preventDefault(); z.classList.remove("over"); }); });
  z.addEventListener("drop",function(e){ const f=e.dataTransfer.files[0]; if(f) handleFile(f); });
}

function handleFile(file){
  if(UP.busy) return;
  UP.err=""; UP.info=""; UP.done=null;
  if(!API.available){ UP.err="Upload needs the local server. Run: python server.py, then open http://127.0.0.1:8765"; refreshUploadCard(); return; }
  if(!/\.pdf$/i.test(file.name) && file.type!=="application/pdf"){ UP.err="Please choose a PDF file."; refreshUploadCard(); return; }
  if(file.size>(CFG.maxUploadMb||300)*1024*1024){ UP.err="That PDF is larger than "+(CFG.maxUploadMb||300)+" MB."; refreshUploadCard(); return; }
  if(!hasKey()){
    UP.pending=file;
    refreshUploadCard(); const f=document.getElementById("keyField"); if(f) f.focus(); return;
  }
  runExtraction(file);
}

async function runExtraction(file){
  const ev=document.getElementById("evalChk"); const withEval=!!(ev&&ev.checked);
  UP.busy=true; UP.pct=3; UP.fileName=file.name; UP.msg="Uploading"; refreshUploadCard();
  let seenCost=0;
  console.log("%ccost%c extracting "+file.name+(withEval?" (with evaluator)":"")+" — per-call cost will appear here", COST_CSS.head, "");
  try{
    const headers={ "X-Filename": encodeURIComponent(file.name), "X-Eval": withEval?"1":"0", "Content-Type":"application/pdf" };
    if(getKey()) headers["X-Gemini-Key"]=getKey();
    const r=await fetch("/api/extract",{ method:"POST", headers:headers, body:file });
    const j=await r.json();
    if(!r.ok){ return endUpload(j, file); }
    for(;;){
      await new Promise(function(res){ setTimeout(res, 1000); });
      const s=await (await fetch("/api/jobs/"+j.jobId)).json();
      seenCost=logCost(s.cost, seenCost, file.name, s.status!=="running");
      if(s.status==="running"){
        UP.msg=(s.message||"Working")+(s.total?" ("+s.done+"/"+s.total+")":"");
        UP.pct=s.total?Math.max(3,Math.round(100*s.done/s.total)):5;
        const m=document.querySelector(".up-msg"), b=document.querySelector(".up-prog .bar i"), pc=document.querySelector(".up-pct");
        if(m) m.textContent=UP.msg; if(b) b.style.width=UP.pct+"%"; if(pc) pc.textContent=UP.pct+"%";
      } else if(s.status==="done"){
        UP.busy=false; UP.pending=null; ingestDoc(s.doc);
        UP.done={ key:"U_"+s.doc.id, beNo:s.doc.boe.beNo, fields:(s.doc.quality&&s.doc.quality.fields)||0, review:(s.doc.quality&&(s.doc.quality.needsReview+s.doc.quality.failedChecks))||0 };
        if(state.page==="list") render(); else toast("Extracted BE "+s.doc.boe.beNo);
        return;
      } else { return endUpload(s, file); }
    }
  } catch(e){ endUpload({ error:"Could not reach the local server." }, file); }
}
function endUpload(j, file){
  UP.busy=false;
  if(j.code==="bad_key" || j.code==="no_key"){
    setKey(""); UP.pending=file; UP.keyErr="The AI Key was rejected. Paste a valid key to retry.";
  } else { UP.err=j.error||"Extraction failed."; }
  refreshUploadCard();
}

async function downloadReport(key, btn){
  const src = RAW[key] || DOCS[key]; if(!src) return;
  const doc = JSON.parse(JSON.stringify(src));
  doc.declarations = (doc.declarations||[]).map(function(d){ return { "for": d["for"], text: d.text || TXT[d.key] || "" }; });
  const old = btn.innerHTML; btn.disabled = true; btn.textContent = "Preparing…";
  try{
    const r = await fetch("/api/report", { method:"POST", headers:{ "Content-Type":"application/json" }, body: JSON.stringify(doc) });
    if(!r.ok){ const j = await r.json().catch(function(){ return {}; }); throw new Error(j.error || ("HTTP "+r.status)); }
    const blob = await r.blob();
    const a = document.createElement("a"); a.href = URL.createObjectURL(blob);
    a.download = "BE_"+doc.boe.beNo+"_"+doc.boe.portCode+"_extracted_data.pdf";
    document.body.appendChild(a); a.click(); a.remove(); setTimeout(function(){ URL.revokeObjectURL(a.href); }, 5000);
  }catch(e){ toast("Could not create the PDF: "+e.message); }
  btn.disabled = false; btn.innerHTML = old;
}
function deepEscape(x){
  if(typeof x==="string") return escapeHtml(x);
  if(Array.isArray(x)) return x.map(deepEscape);
  if(x && typeof x==="object"){ const o={}; Object.keys(x).forEach(function(k){ o[k]=deepEscape(x[k]); }); return o; }
  return x;
}
function ingestDoc(doc){
  if(!doc || !/^[0-9a-f]{12}$/.test(doc.id||"")) return;
  RAW["U_"+doc.id] = doc;
  DOCS["U_"+doc.id] = deepEscape(doc);      // uploaded text is untrusted: escape before it reaches innerHTML
}
const HIDE_STORE = "boe_hidden_samples";
function getHidden(){ try{ return JSON.parse(localStorage.getItem(HIDE_STORE)||"[]"); }catch(e){ return []; } }
function setHidden(a){ try{ localStorage.setItem(HIDE_STORE, JSON.stringify(a)); }catch(e){} }
function visibleKeys(){ const h=getHidden(); return Object.keys(DOCS).filter(function(k){ return h.indexOf(k)===-1; }); }
function restoreHidden(){ setHidden([]); render(); }
let confirmDel = null;   // key of the bill whose inline "are you sure?" is showing
function delControlsHTML(key){
  if(confirmDel === key){
    return '<span class="del-q">Delete this bill?</span>'
      + '<button class="row-del solid" onclick="event.stopPropagation();deleteBill(\''+key+'\')">Yes, delete</button>'
      + '<button class="row-dl" onclick="event.stopPropagation();askDelete(null)">Cancel</button>';
  }
  return '<button class="row-del" title="Delete this bill" onclick="event.stopPropagation();askDelete(\''+key+'\')">'+ICON_DEL+'<span>Delete</span></button>';
}
function askDelete(key){ confirmDel = key; renderBillTable(); }
async function deleteBill(key){
  const d=DOCS[key]; confirmDel = null; if(!d){ render(); return; }
  if(d.uploaded){
    try{
      const r = await fetch("/api/docs/"+d.id,{ method:"DELETE" });
      if(!r.ok) throw new Error("HTTP "+r.status);
    }catch(e){ toast("Could not delete: "+e.message); render(); return; }
    delete DOCS[key]; delete RAW[key];
    toast("Deleted BE "+d.boe.beNo);
  } else {
    const h=getHidden(); if(h.indexOf(key)===-1) h.push(key); setHidden(h);
    toast("Removed sample BE "+d.boe.beNo+" (restore link is under the list)");
  }
  render();
}

function qualityHTML(doc){
  const q=doc.quality; if(!q) return "";
  const bad=q.needsReview>0 || q.failedChecks>0;
  let h='<div class="qbanner '+(bad?'warn':'ok')+'"><b>Extracted from '+(doc.sourceFile||"PDF")+'</b> &middot; '
    +q.fields+' fields from Parts I&ndash;III, '+q.failedChecks+' failed cross-checks, '+q.needsReview+' need review'
    +(q.evaluator?' (evaluator on)':' (evaluator off)')
    +'. Other sections (status, parties, Part IV/VI) are read by the model but not cross-checked.';
  if(q.review.length){
    h+='<details><summary>Fields to review</summary><ul>'+q.review.map(function(r){
      return '<li><code>'+r.path+'</code> = '+r.value+' <span style="color:var(--ink-soft)">(p'+(r.page||"?")+') '+(r.reasons||[]).join("; ")+'</span></li>'; }).join("")+'</ul></details>';
  }
  if(q.checks.length){
    h+='<details><summary>Failed checks</summary><ul>'+q.checks.map(function(c){ return '<li>'+c.check+': '+c.message+'</li>'; }).join("")+'</ul></details>';
  }
  return h+'</div>';
}

async function initApi(){
  try{
    const c=await fetch("/api/config"); if(!c.ok) return;
    const cfg=await c.json(); API.available=true; API.serverKey=cfg.serverKey; API.samplePdfs=cfg.samplePdfs||[]; if(cfg.maxUploadMb) CFG.maxUploadMb=cfg.maxUploadMb;
    const docs=await (await fetch("/api/docs")).json();
    docs.forEach(ingestDoc);
    if(state.page==="list") render(); else refreshUploadCard();
  }catch(e){ /* opened as a plain file: upload disabled */ }
}
initDocs();
render();
initApi();
</script>
