<!doctype html>
<meta charset="utf-8">
<title>Bill of Entry Explorer — Maruti Suzuki</title>
<style>
:root{
  --paper:#FFFFFF; --paper-2:#F2F8FD; --ink:#122237; --ink-soft:#5C7089;
  --blue:#1950B1; --blue-deep:#133C84; --blue-pale:#DCE7F5; --line:#D9E7F3;
  --line-soft:#EDF5FC; --danger:#B23B3B; --red:#E20916;
  --sans:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
  --mono:ui-monospace,"SFMono-Regular",Menlo,Consolas,"Liberation Mono",monospace;
}
*{box-sizing:border-box;}
html,body{ background:var(--paper); }
body{
  margin:0; color:var(--ink); font-family:var(--sans); font-size:15px; line-height:1.5;
  padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
}

/* ---------- header ---------- */
.topbar{
  background:var(--blue-pale);
  border-bottom:1px solid var(--line);
  box-shadow:0 2px 10px rgba(19,60,132,.09);
  padding:14px clamp(20px, 4vw, 40px);
  position:relative; z-index:2;
}
.topbar-inner{ max-width:1400px; margin:0 auto; display:flex; align-items:center; justify-content:space-between; gap:16px; }
.topbar-brand{ display:flex; align-items:center; gap:16px; }
.logo-img{ height:40px; width:auto; display:block; flex:0 0 auto; }
.topbar-divider{ width:1px; height:34px; background:var(--line); }
.topbar-text .company{ font-weight:700; font-size:16.5px; color:var(--blue-deep); }
.topbar-text .appname{ font-size:12.5px; color:var(--ink-soft); margin-top:1px; }
.topbar-meta{
  font-size:11.5px; letter-spacing:.04em; color:var(--blue);
  background:#fff; border:1px solid var(--line); border-radius:20px;
  padding:5px 14px; white-space:nowrap;
}
@media (max-width:640px){ .topbar{ padding:10px 16px; } .topbar-meta{ display:none; } .logo-img{ height:32px; } }

/* ---------- list page ---------- */
.list-page{ width:92%; max-width:1320px; margin:0 auto; padding:40px 0 80px; }
.list-header{ display:flex; align-items:center; justify-content:space-between; gap:18px; flex-wrap:wrap; margin-bottom:26px; }
.list-header .search-bar{ margin-left:auto; }
.title-block{ display:flex; align-items:center; gap:14px; }
.title-accent{ width:5px; height:32px; background:var(--red); border-radius:3px; flex:0 0 5px; }
.list-page h1{ font-size:32px; margin:0; font-weight:700; color:var(--blue-deep); letter-spacing:-.01em; }
.search-bar{ position:relative; width:300px; max-width:100%; }
@media (max-width:640px){
  .list-header{ flex-direction:column; align-items:stretch; gap:14px; }
  .search-bar{ width:100%; }
}
.search-bar svg{ position:absolute; left:13px; top:50%; transform:translateY(-50%); width:16px; height:16px; color:var(--ink-soft); pointer-events:none; }
.search-bar input{
  width:100%; padding:11px 14px 11px 38px; border:1px solid var(--line); border-radius:8px;
  background:#fff; color:var(--ink); font-size:14px; font-family:var(--sans);
}
.search-bar input:focus{ outline:none; border-color:var(--blue); box-shadow:0 0 0 3px var(--blue-pale); }
.search-bar input::placeholder{ color:var(--ink-soft); }
.no-results{ padding:30px 22px; color:var(--ink-soft); font-size:14px; text-align:center; }
.stats-strip{ display:flex; gap:16px; margin-bottom:28px; flex-wrap:wrap; }
.stat-card{ flex:0 1 260px; background:#fff; border:1px solid var(--line); border-radius:10px; padding:18px 20px; }
.stat-card .stat-label{ font-size:12px; color:var(--ink-soft); font-weight:600; }
.stat-card .stat-value{ font-size:25px; font-weight:700; color:var(--ink); margin-top:6px; font-family:var(--mono); }
.stat-card.lead{ background:var(--blue-deep); border-color:var(--blue-deep); }
.stat-card.lead .stat-label{ color:#AFC3E4; }
.stat-card.lead .stat-value{ color:#fff; }
@media (max-width:640px){ .stat-card{ flex:1 1 45%; } }
.bill-table{ border:1px solid var(--line); border-radius:10px; overflow:hidden; background:var(--paper); }
.bill-row{
  display:grid; grid-template-columns:1.15fr .9fr 1.3fr .85fr .65fr 1.05fr 1.05fr 1.05fr 20px;
  gap:14px; align-items:center; padding:17px 22px; border-bottom:1px solid var(--line-soft);
}
.bill-row:last-child{ border-bottom:none; }
.bill-row > div:not(:last-child){ border-right:1px solid var(--line-soft); }
.bill-row.hd{ font-size:11.5px; letter-spacing:.03em; color:var(--ink); font-weight:700; padding-top:13px; padding-bottom:13px; background:var(--blue-pale); border-bottom:2px solid var(--line); }
.bill-row.hd > div:not(:last-child){ border-right:1px solid var(--line); }
.bill-row.item{ cursor:pointer; }
.bill-row.item:hover{ background:var(--paper-2); }
.bill-row .beno{ font-family:var(--mono); font-weight:600; font-size:14.5px; }
.bill-row .badge{ display:inline-block; font-size:10.5px; color:var(--blue-deep); background:var(--blue-pale); border-radius:4px; padding:1px 6px; margin-top:3px; }
.bill-row .num{ font-family:var(--mono); text-align:right; }
.bill-row .chev{ color:var(--blue); text-align:right; font-size:16px; }
.bill-row .field .l{ display:none; }
@media (max-width:820px){
  .list-page{ width:100%; padding:28px 18px 60px; }
  .bill-row.hd{ display:none; }
  .bill-row.item{ grid-template-columns:1fr; gap:4px; padding:16px 18px; }
  .bill-row.item > div{ border-right:none; }
  .bill-row.item .field{ display:flex; justify-content:space-between; font-size:13.5px; }
  .bill-row.item .field .l{ display:inline; color:var(--ink-soft); }
  .bill-row.item .num{ text-align:right; }
}

/* ---------- detail page ---------- */
.app{ display:flex; min-height:calc(100vh - 71px); }
.rail{
  width:280px; flex:0 0 280px; border-right:1px solid var(--line);
  background:var(--paper-2); display:flex; flex-direction:column;
}
.back-btn{
  margin:16px 14px 0; text-align:left; border:1px solid var(--line); background:var(--paper);
  border-radius:6px; padding:9px 12px; cursor:pointer; color:var(--blue-deep); font-size:13.5px; font-weight:600;
}
.back-btn:hover{ background:var(--blue-pale); }
.current-bill{ padding:16px 18px 6px; border-bottom:1px solid var(--line); margin-top:4px; }
.current-bill .cb-no{ font-family:var(--mono); font-weight:600; font-size:15px; color:var(--ink); }
.current-bill .cb-port{ font-size:12.5px; color:var(--ink-soft); margin-top:2px; }
nav{ flex:1; overflow-y:auto; padding:6px 8px 18px; }
.part-label{ font-size:11px; letter-spacing:.06em; color:var(--ink-soft); font-weight:600; padding:14px 10px 4px; }
.sec-btn{
  display:block; width:100%; text-align:left; border:none; background:none;
  color:var(--ink); padding:7px 12px; border-radius:5px; cursor:pointer; font-size:14px;
}
.sec-btn:hover{ background:var(--blue-pale); }
.sec-btn.active{ background:var(--blue-deep); color:#fff; }
.inv-tabs{ display:flex; gap:4px; padding:4px 10px 8px; flex-wrap:wrap; }
.inv-tab{
  border:1px solid var(--line); background:var(--paper); color:var(--ink-soft);
  font-family:var(--mono); font-size:12px; padding:3px 8px; border-radius:4px; cursor:pointer;
}
.inv-tab.active{ border-color:var(--blue-deep); color:var(--blue-deep); font-weight:600; background:var(--blue-pale); }
main{ flex:1; min-width:0; padding:28px 40px 60px; max-width:920px; }
.crumb{ font-size:13px; color:var(--ink-soft); margin-bottom:6px; }
.crumb b{ color:var(--ink); font-weight:600; }
h2.title{ margin:0 0 2px; font-size:22px; font-weight:600; color:var(--ink); }
.sheet{ border:1px solid var(--line); border-radius:8px; background:var(--paper); overflow:hidden; }
.field-row{ display:flex; gap:18px; padding:11px 18px; border-bottom:1px solid var(--line-soft); align-items:baseline; }
.field-row:last-child{ border-bottom:none; }
.field-row .fno{ font-family:var(--mono); font-size:12px; color:var(--ink-soft); width:26px; flex:0 0 26px; }
.field-row .flabel{ width:190px; flex:0 0 190px; color:var(--ink-soft); font-size:13.5px; }
.field-row .fvalue{ flex:1; font-weight:500; word-break:break-word; }
.field-row.flash{ animation:flash 1.1s ease; }
@keyframes flash{ 0%{ background:var(--blue-pale);} 100%{ background:transparent;} }
.empty{ color:var(--ink-soft); font-style:italic; }
.note{ margin-top:16px; padding:12px 16px; border:1px dashed var(--line); border-radius:8px; color:var(--ink-soft); font-size:13.5px; }
table.items{ width:100%; border-collapse:collapse; font-size:13.5px; border:1px solid var(--line); }
table.items th{
  text-align:left; font-size:11.5px; letter-spacing:.03em; color:var(--ink); font-weight:700;
  border:1px solid var(--line); padding:9px 10px; position:sticky; top:0; background:var(--blue-pale);
}
table.items td{ padding:8px 10px; border:1px solid var(--line-soft); vertical-align:top; }
table.items tr.item-row{ cursor:pointer; }
table.items tr.item-row:hover{ background:var(--paper-2); }
table.items td.num{ text-align:right; font-family:var(--mono); white-space:nowrap; }
table.items tr.tot td{ background:var(--blue-pale); font-weight:700; border-top:2px solid var(--line); }
table.items td.cth{ font-family:var(--mono); color:var(--ink-soft); white-space:nowrap; }
.items-wrap{ max-height:560px; overflow:auto; border:1px solid var(--line); border-radius:8px; }
.item-detail{ margin-top:16px; border:1px solid var(--blue-deep); border-radius:8px; overflow:hidden; }
.item-detail .hd{ background:var(--blue-pale); padding:10px 16px; font-weight:600; display:flex; justify-content:space-between; }
.item-detail .hd button{ background:none; border:none; color:var(--ink-soft); cursor:pointer; font-size:13px; }
@media (max-width:760px){
  .app{ flex-direction:column; min-height:auto; }
  .rail{ width:100%; flex:none; }
  nav{ max-height:280px; }
  main{ padding:20px 16px 48px; }
  .field-row{ flex-wrap:wrap; }
  .field-row .flabel{ width:100%; }
}

/* ---------- upload / key / progress ---------- */
.list-actions{ display:flex; align-items:center; gap:10px; flex-wrap:wrap; }
.btn{ border:1px solid var(--line); background:#fff; color:var(--blue-deep); border-radius:8px; padding:10px 16px; font-size:14px; font-weight:600; cursor:pointer; font-family:var(--sans); }
.btn:hover{ background:var(--blue-pale); }
.btn.primary{ background:var(--blue-deep); border-color:var(--blue-deep); color:#fff; }
.btn.primary:hover{ background:var(--blue); }
.btn:disabled{ opacity:.55; cursor:not-allowed; }
.keystate{ font-size:12px; color:var(--ink-soft); }
.dropzone{ border:2px dashed var(--line); border-radius:10px; padding:18px; text-align:center; color:var(--ink-soft); font-size:13.5px; margin-bottom:22px; background:var(--paper-2); }
.dropzone.over{ border-color:var(--blue); background:var(--blue-pale); color:var(--blue-deep); }
.dropzone a{ color:var(--blue); cursor:pointer; font-weight:600; text-decoration:underline; }
.badge.up{ background:#E3F4E8; color:#1E6B3A; margin-left:4px; }
.row-actions{ display:flex; gap:6px; flex-wrap:wrap; margin-top:6px; }
.row-dl{ border:1px solid var(--line); background:#fff; color:var(--blue-deep); font-size:12px; padding:3px 9px; border-radius:6px; font-family:var(--sans); cursor:pointer; }
.row-dl:disabled{ opacity:.6; cursor:wait; }
.row-dl, .row-del{ display:inline-flex; align-items:center; gap:5px; line-height:1; }
.row-dl svg, .row-del svg{ flex:0 0 auto; }
.row-dl:hover{ background:var(--blue-pale); }
.row-del{ border:1px solid #E7C4C4; background:#fff; color:var(--danger); cursor:pointer; font-size:12px; padding:3px 9px; border-radius:6px; font-family:var(--sans); }
.row-del:hover{ background:#FBEAEA; }
.row-del.solid{ background:var(--danger); border-color:var(--danger); color:#fff; }
.row-del.solid:hover{ background:#8F2E2E; }
.del-q{ font-size:12.5px; color:var(--danger); font-weight:600; align-self:center; }
.restore{ margin-top:12px; font-size:13px; color:var(--ink-soft); }
.restore a{ color:var(--blue); cursor:pointer; text-decoration:underline; }
.modal-bg{ position:fixed; inset:0; background:rgba(18,34,55,.45); display:flex; align-items:center; justify-content:center; z-index:50; padding:16px; }
.modal{ background:#fff; border-radius:12px; padding:24px; width:480px; max-width:100%; box-shadow:0 12px 40px rgba(0,0,0,.25); }
.modal h3{ margin:0 0 8px; color:var(--blue-deep); font-size:18px; }
.modal p{ margin:0 0 12px; font-size:13.5px; color:var(--ink-soft); }
.modal input[type=password],.modal input[type=text]{ width:100%; padding:11px 12px; border:1px solid var(--line); border-radius:8px; font-family:var(--mono); font-size:13.5px; }
.modal input:focus{ outline:none; border-color:var(--blue); box-shadow:0 0 0 3px var(--blue-pale); }
.modal .btns{ display:flex; justify-content:flex-end; gap:8px; margin-top:16px; }
.modal .err{ color:var(--danger); font-size:13px; margin-top:8px; }
.modal label.chk{ display:flex; gap:8px; align-items:flex-start; font-size:13px; color:var(--ink); margin-top:12px; }
.bar{ height:8px; background:var(--blue-pale); border-radius:6px; overflow:hidden; margin:14px 0 6px; }
.bar > i{ display:block; height:100%; background:var(--blue); width:0; transition:width .3s; }
.qbanner{ margin:0 0 16px; padding:11px 16px; border-radius:8px; font-size:13.5px; border:1px solid var(--line); background:var(--paper-2); color:var(--ink); }
.qbanner.warn{ border-color:#E0B25A; background:#FFF7E6; }
.qbanner.ok{ border-color:#9CCFAE; background:#EEF8F1; }
.qbanner details{ margin-top:8px; }
.qbanner summary{ cursor:pointer; font-weight:600; }
.qbanner ul{ margin:6px 0 0; padding-left:18px; max-height:220px; overflow:auto; font-size:12.5px; }
.qbanner code{ font-family:var(--mono); font-size:12px; }
.toast{ position:fixed; bottom:20px; left:50%; transform:translateX(-50%); background:var(--ink); color:#fff; padding:10px 18px; border-radius:8px; font-size:13.5px; z-index:60; max-width:90%; }

/* ---------- upload card (drop zone + key) ---------- */
.upload-card{ display:grid; grid-template-columns:1.5fr 1fr; gap:16px; margin-bottom:24px; }
@media (max-width:860px){ .upload-card{ grid-template-columns:1fr; } }
.upload-card .dropzone{ margin:0; padding:28px 22px; border-radius:14px; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:6px; min-height:210px; text-align:center; transition:background .15s,border-color .15s; }
.upload-card .dropzone.busy{ border-style:solid; border-color:var(--blue); background:#fff; }
.upload-card .dropzone.done{ border-style:solid; border-color:#9CCFAE; background:#F3FAF5; }
.upload-card .dropzone.error{ border-style:solid; border-color:#E7C4C4; background:#FFF7F7; }
.upload-card .dropzone.waiting{ border-style:solid; border-color:var(--blue); background:#fff; }
.dz-icon{ width:52px; height:52px; border-radius:50%; background:var(--blue-pale); color:var(--blue-deep); display:flex; align-items:center; justify-content:center; margin-bottom:4px; }
.dz-icon.ok{ background:#DDF1E4; color:#1E6B3A; }
.dz-icon.err{ background:#F8DDDD; color:var(--danger); }
.dz-title{ font-size:16.5px; font-weight:650; color:var(--ink); word-break:break-word; max-width:100%; }
.dz-sub{ color:var(--ink-soft); font-size:13.5px; min-height:20px; max-width:440px; }
.dz-sub.err-text{ color:var(--danger); }
.dz-sub .btn{ padding:6px 14px; margin-left:4px; }
.dz-hint{ color:var(--ink-soft); font-size:12px; margin-top:4px; opacity:.85; }
.dz-actions{ display:flex; gap:8px; margin-top:10px; flex-wrap:wrap; justify-content:center; }
.dz-actions .btn{ padding:8px 16px; }
.spinner{ width:22px; height:22px; border:3px solid var(--blue-pale); border-top-color:var(--blue); border-radius:50%; animation:spin .8s linear infinite; display:block; }
@keyframes spin{ to{ transform:rotate(360deg); } }
.up-prog{ display:flex; align-items:center; gap:10px; width:100%; max-width:380px; margin-top:6px; }
.up-prog .bar{ flex:1; margin:0; }
.up-pct{ font-family:var(--mono); font-size:12.5px; color:var(--blue-deep); min-width:38px; text-align:right; }

.upload-side{ border:1px solid var(--line); border-radius:14px; padding:18px 20px; background:#fff; display:flex; flex-direction:column; gap:12px; }
.upload-side.needs-key{ border-color:var(--blue); box-shadow:0 0 0 3px var(--blue-pale); }
.side-head{ display:flex; align-items:center; justify-content:space-between; gap:8px; }
.side-title{ font-size:12px; letter-spacing:.06em; font-weight:700; color:var(--ink-soft); text-transform:uppercase; }
.pill{ font-size:11.5px; font-weight:600; padding:3px 10px; border-radius:20px; }
.pill.ok{ background:#DDF1E4; color:#1E6B3A; }
.pill.warn{ background:#FFF1D6; color:#8A5A00; }
.fld-label{ font-size:12.5px; font-weight:600; color:var(--ink); margin-bottom:-6px; }
.keyrow{ display:flex; gap:8px; }
.keyinput{ position:relative; flex:1; min-width:0; }
.keyinput input{ width:100%; padding:10px 38px 10px 12px; border:1px solid var(--line); border-radius:9px; font-family:var(--mono); font-size:13px; background:#fff; color:var(--ink); }
.keyinput input:focus{ outline:none; border-color:var(--blue); box-shadow:0 0 0 3px var(--blue-pale); }
.keyinput .eye{ position:absolute; right:4px; top:50%; transform:translateY(-50%); border:none; background:none; color:var(--ink-soft); cursor:pointer; padding:6px; display:flex; border-radius:6px; }
.keyinput .eye:hover{ color:var(--blue-deep); background:var(--paper-2); }
.keyrow .btn{ padding:9px 16px; }
.fld-err{ color:var(--danger); font-size:12.5px; font-weight:500; margin-top:-4px; }
.fld-hint{ font-size:12.5px; color:var(--ink-soft); margin-top:-4px; }
.fld-hint a{ color:var(--blue); cursor:pointer; text-decoration:underline; }
.key-card{ display:flex; align-items:center; gap:12px; padding:11px 13px; border:1px solid var(--line); border-radius:10px; background:var(--paper-2); color:var(--blue-deep); }
.key-meta{ flex:1; min-width:0; }
.key-name{ font-size:13px; font-weight:600; color:var(--ink); }
.key-mask{ font-family:var(--mono); font-size:12.5px; color:var(--ink-soft); letter-spacing:.02em; }
.key-acts{ display:flex; gap:12px; font-size:12.5px; }
.key-acts a{ color:var(--blue); cursor:pointer; text-decoration:underline; }
.switch-row{ display:flex; gap:12px; align-items:flex-start; padding-top:12px; border-top:1px solid var(--line-soft); }
.sw-title{ font-size:13.5px; font-weight:600; color:var(--ink); }
.sw-sub{ font-size:12.5px; color:var(--ink-soft); margin-top:2px; }
.switch{ position:relative; display:inline-block; width:38px; height:22px; flex:0 0 38px; margin-top:1px; }
.switch input{ opacity:0; width:0; height:0; position:absolute; }
.slider{ position:absolute; inset:0; background:#C9D6E6; border-radius:22px; cursor:pointer; transition:background .15s; }
.slider::before{ content:""; position:absolute; height:16px; width:16px; left:3px; top:3px; background:#fff; border-radius:50%; transition:transform .15s; box-shadow:0 1px 2px rgba(0,0,0,.25); }
.switch input:checked + .slider{ background:var(--blue); }
.switch input:checked + .slider::before{ transform:translateX(16px); }
.switch input:focus-visible + .slider{ box-shadow:0 0 0 3px var(--blue-pale); }

/* ---------- field editing + confidence ---------- */
.field-row.editable{ align-items:center; }
.field-row .fmeta{ display:flex; align-items:center; gap:8px; margin-left:auto; flex:0 0 auto; }
.fedit{ border:1px solid transparent; background:none; color:var(--ink-soft); cursor:pointer; border-radius:6px; padding:4px 6px; display:flex; opacity:.55; }
.field-row:hover .fedit, .fedit:focus{ opacity:1; border-color:var(--line); background:#fff; color:var(--blue-deep); }
.cpill{ font-family:var(--mono); font-size:11.5px; font-weight:600; padding:2px 8px; border-radius:20px; cursor:help; white-space:nowrap; }
.cpill.c-ok{ background:#E3F4E8; color:#1E6B3A; }
.cpill.c-low{ background:#FFE9B8; color:#8A5A00; }
.cpill.c-vlow{ background:#F8D4D4; color:#9B2C2C; }
.cpill.c-edited{ background:var(--blue-pale); color:var(--blue-deep); }
.cpill.c-unrated{ background:#F3EEDD; color:#8A7B4A; font-weight:400; }
.cpill.none{ background:#F0F3F7; color:var(--ink-soft); font-weight:400; }
.field-row.c-low{ background:#FFF8E6; box-shadow:inset 3px 0 0 #E0A21B; }
.field-row.c-vlow{ background:#FDEEEE; box-shadow:inset 3px 0 0 var(--danger); }
.field-row.c-edited{ box-shadow:inset 3px 0 0 var(--blue); }
td.ecell{ cursor:text; }
td.ecell:hover{ outline:1px dashed var(--blue); outline-offset:-2px; }
td.c-low{ background:#FFF2CC; }
td.c-vlow{ background:#FADADA; }
td.c-edited{ background:#E8F0FB; }
td.editing{ padding:4px; min-width:150px; }
.ein{ width:100%; padding:8px 10px; border:1px solid var(--blue); border-radius:8px; font-family:var(--sans); font-size:14px; box-shadow:0 0 0 3px var(--blue-pale); background:#fff; color:var(--ink); }
textarea.ein{ resize:vertical; line-height:1.4; }
.ebtns{ display:flex; gap:6px; flex-wrap:wrap; margin-top:8px; }
.ebtns .btn{ padding:5px 12px; font-size:12.5px; }
.eerr{ color:var(--danger); font-size:12.5px; font-weight:500; margin-top:4px; }
.eerr:empty{ display:none; }
.eorig{ color:var(--ink-soft); font-size:12px; margin-top:4px; }
.navdot{ float:right; background:#E0A21B; color:#fff; border-radius:10px; padding:0 7px; font-size:11px; font-weight:700; line-height:18px; }
.navdot.sm{ float:none; margin-left:5px; padding:0 5px; font-size:10px; line-height:15px; }
.sec-btn.active .navdot{ background:#fff; color:#8A5A00; }
.badge.low{ background:#FFE9B8; color:#8A5A00; margin-left:4px; }
.rbar{ display:flex; justify-content:space-between; align-items:center; gap:10px; flex-wrap:wrap; margin:0 0 16px; padding:10px 14px; border-radius:8px; font-size:13.5px; border:1px solid var(--line); }
.rbar.warn{ background:#FFF8E6; border-color:#E8CB86; }
.rbar.ok{ background:#EEF8F1; border-color:#9CCFAE; }
.rbtns{ display:flex; align-items:center; gap:14px; flex-wrap:wrap; }
.rbtns .btn{ padding:5px 12px; font-size:12.5px; }
.lg{ font-size:12px; color:var(--ink-soft); display:inline-flex; align-items:center; gap:5px; }
.sw{ width:12px; height:12px; border-radius:3px; display:inline-block; border:1px solid rgba(0,0,0,.12); }
.sw.c-low{ background:#FFE9B8; } .sw.c-vlow{ background:#F8D4D4; } .sw.c-edited{ background:var(--blue-pale); }
h3.subtitle{ font-size:15px; margin:20px 0 8px; color:var(--blue-deep); }

/* ---------- source PDF pane ---------- */
.pdf-toggle{ display:flex; align-items:center; gap:8px; width:calc(100% - 28px); margin:10px 14px 0; padding:9px 12px; border:1px solid var(--line); background:#fff; color:var(--blue-deep); border-radius:6px; cursor:pointer; font-size:13.5px; font-weight:600; font-family:var(--sans); }
.pdf-toggle:hover{ background:var(--blue-pale); }
.pdf-toggle.on{ background:var(--blue-deep); border-color:var(--blue-deep); color:#fff; }
.pdf-na{ margin:10px 14px 0; font-size:12px; color:var(--ink-soft); line-height:1.4; }
.app.withpdf{ align-items:flex-start; }
.app.withpdf .rail{ flex:0 0 240px; width:240px; }
.app.withpdf main{ flex:1 1 52%; max-width:none; padding:24px 28px 60px; }
.pdfpane{ flex:1 1 48%; min-width:380px; position:sticky; top:0; height:calc(100vh - 71px); display:flex; flex-direction:column; border-left:1px solid var(--line); background:#E9EFF7; }
.pdf-head{ display:flex; justify-content:space-between; align-items:center; gap:8px; padding:8px 12px; background:#fff; border-bottom:1px solid var(--line); flex-wrap:wrap; }
.pdf-title{ font-weight:650; font-size:13.5px; color:var(--blue-deep); }
.pdf-ctrl{ display:flex; align-items:center; gap:4px; }
.pdf-ctrl button, .pdf-ctrl a.pdf-open{ border:1px solid var(--line); background:#fff; color:var(--blue-deep); border-radius:6px; min-width:28px; height:28px; padding:0 8px; cursor:pointer; font-size:14px; font-family:var(--sans); display:inline-flex; align-items:center; justify-content:center; text-decoration:none; }
.pdf-ctrl button:hover, .pdf-ctrl a.pdf-open:hover{ background:var(--blue-pale); }
.pdf-ctrl a.pdf-open{ font-size:12.5px; }
.pdf-ctrl .pg{ font-family:var(--mono); font-size:12px; color:var(--ink-soft); min-width:84px; text-align:center; }
.pdf-ctrl .sep{ width:8px; }
.pdf-hl{ position:absolute; background:rgba(255,213,0,.4); outline:2px solid #E0A21B; border-radius:2px; animation:hlpulse 1.2s ease 2; }
@keyframes hlpulse{ 0%,100%{ background:rgba(255,213,0,.4); } 50%{ background:rgba(255,160,0,.65); } }
.pdf-msg{ padding:20px; text-align:center; color:var(--danger); font-size:13.5px; }
@media (max-width:1100px){
  .app.withpdf{ align-items:stretch; }
  .app.withpdf .rail{ flex:0 0 280px; width:280px; }
  .pdfpane{ position:fixed; right:0; top:0; bottom:0; height:auto; width:min(100vw,560px); min-width:0; z-index:40; box-shadow:-8px 0 30px rgba(19,60,132,.25); }
}

.pdf-scroll{ flex:1; overflow:auto; padding:12px; position:relative; }
#pdfPages{ margin:0 auto; }
.pdf-page{ position:relative; height:0; background:#fff; box-shadow:0 1px 6px rgba(19,60,132,.2); margin:0 0 12px; }
.pdf-page img{ position:absolute; inset:0; width:100%; height:100%; display:block; }
.pdf-page .hl{ position:absolute; inset:0; pointer-events:none; }
.pdf-page .pn{ position:absolute; top:6px; right:8px; font:600 11px var(--mono); color:var(--ink-soft); background:rgba(255,255,255,.85); padding:1px 7px; border-radius:10px; pointer-events:none; }

/* ---------- section catalog: tags + notes ---------- */
.sec-btn.none{ color:var(--ink-soft); font-style:italic; }
.sec-btn.none.active{ color:#fff; }
.tag{ display:inline-block; margin-left:6px; padding:0 6px; border-radius:8px; font-size:10px; font-weight:600; font-style:normal; line-height:16px; vertical-align:1px; }
.tag.p{ background:#FFE9B8; color:#8A5A00; }
.tag.n{ background:#E6EAF0; color:#5C7089; }
.tag.e{ background:#EDF3F9; color:#7C8EA6; font-weight:500; }
.sec-btn.active .tag{ background:rgba(255,255,255,.22); color:#fff; }
.missnote{ margin:8px 0 14px; padding:10px 14px; border-radius:8px; font-size:13px; line-height:1.5; border:1px solid var(--line); }
.missnote.part{ background:#FFFAEB; border-color:#EBD79B; }
.missnote.none{ background:#F1F4F8; border-color:#D5DDE8; }
.missnote .fl{ color:var(--ink-soft); }

/* ---------- Part III duty matrices ---------- */
.itemhd{ margin:16px 0 6px; font-weight:650; font-size:13.5px; color:var(--blue-deep); }
table.items th.rl{ background:var(--paper-2); font-weight:600; white-space:nowrap; text-align:left; }
</style>

function fmt(n){

  if(typeof n!=="number") return n;
  return n.toLocaleString(undefined,{minimumFractionDigits:2, maximumFractionDigits:2});
}

function matchesSearch(key, q){
  if(!q) return true;
  const d = DOCS[key];
  const hay = [d.boe.beNo, d.boe.port, d.boe.portCode, d.boe.docType, d.status.countryOfOrigin,
    d.status.mode, d.declarant.importerName, d.declarant.cbName, d.sourceFile].join(" ").toLowerCase();
  return hay.indexOf(q) !== -1;
}
function renderBillTable(){
  const wrap = document.getElementById("billTableWrap");
  if(!wrap) return;
  const q = (state.search || "").trim().toLowerCase();
  const keys = visibleKeys().filter(function(k){ return matchesSearch(k, q); });
  const header = '<div class="bill-row hd"><div>BE No.</div><div>Date</div><div>Port</div><div>Origin</div><div>Mode</div>'
    + '<div>Invoices / items</div><div style="text-align:right">Assessable value</div><div style="text-align:right">Total duty</div><div></div></div>';
  const hidden = getHidden().filter(function(k){ return DOCS[k]; });
  const restore = hidden.length ? '<div class="restore"><a onclick="restoreHidden()">Restore '+hidden.length+' removed sample bill'+(hidden.length>1?'s':'')+'</a></div>' : '';
  if(keys.length === 0){
    const msg = q ? 'No bills match &ldquo;'+escapeHtml(state.search)+'&rdquo;.' : 'No bills yet. Drop a Bill of Entry PDF above to add one.';
    wrap.innerHTML = '<div class="bill-table">' + header + '<div class="no-results">'+msg+'</div></div>' + restore;
    return;
  }
  wrap.innerHTML = '<div class="bill-table">' + header + keys.map(billRowHTML).join("") + '</div>' + restore;
}

  const has = function(code){ return ks.some(function(k){ const x = d[k]||{}; return Object.keys(x).some(function(f){ return f.indexOf(code)===0 && /(NotnNo|NotnSno|Rate|Amount|DutyFg)$/.test(f) && x[f]!=null; }); }); };
  const acd = ["acd","2.ACD"];
  if(has("acd") && !has("cvd05")) return base.map(function(c){ return c[0]==="cvd05" ? acd : c; });
  if(has("acd")) return base.slice(0,1).concat([acd], base.slice(1));
  return base;
}
function dutySection(field){                       // which Part III section a duty field (bcdRate, caidcNotnNo, upi ...) belongs to
  const m = /^([a-z0-9]+?)(NotnNo|NotnSno|Rate|Amount|DutyFg)$/.exec(field||"");
  if(m){ for(const g of ["B","C","CA"]){ if(DUTY_COLS[g].some(function(c){ return c[0]===m[1]; }) || (g==="B" && m[1]==="acd")) return g; } }
  return "A";
}
const PART4_TITLES = { svb:"SVB details", previous_be:"Previous BEs", reimport:"Re-import after export", manufacturer:"Manufacturer / producer / grower",
  accessory:"Accessory status", licence:"Licence details", scheme_notification:"Scheme notification & duty foregone", certificate:"Certificate details",
  hss:"HSS details", sw_declaration:"Single window declaration", sw_constituents:"Single window - constituents", sw_control:"Single window - control",
  supporting:"Supporting documents", containers:"Container details", invoices:"Invoice details" };
const PART4_ID = { supporting:"M", containers:"CONT", invoices:"INVD" };      // menu ids of the three built-in Part IV pages
const PART4_ORDER = ["svb","previous_be","reimport","manufacturer","accessory","licence","scheme_notification","certificate","hss","sw_declaration","sw_constituents","sw_control"];

function part4Sections(doc){
  const have = {}; (doc.additional||[]).forEach(function(a){ have[a.code] = true; });
  const extracted = Array.isArray(doc.additional);          // false for bills whose Part IV sections were never read
  const letters = doc.sectionLetters, known = letters && Object.keys(letters).length;
  const keys = known
    ? Object.keys(letters).sort(function(a,b){ return letters[a] < letters[b] ? -1 : 1; })   // every section the PDF prints, in print order
    : PART4_ORDER.filter(function(k){ return have[k]; }).concat(["supporting","containers","invoices"]);
  return keys.map(function(k){
    const own = !PART4_ID[k];                                 // an A-L section (not supporting docs / containers / invoices)
    return { s:PART4_ID[k]||k, l:(known && letters[k] ? letters[k]+". " : "")+PART4_TITLES[k],
             st:(own && !have[k] && !extracted) ? "none" : "full", empty:(own && !have[k] && extracted) };
  });
}
function sectionsFor(p, doc){
  if(p.part==="IV") return part4Sections(doc);
  const cat = CATALOG[p.part];
  if(!cat) return p.sections;
  const legacy = !(doc.schema >= 2);                // bills read with the full schema have every printed field
  return cat.map(function(c){
    return { s:c.s, l:(c.L ? c.L+". " : "")+c.l, st:(legacy ? (c.none ? "none" : (c.miss ? "partial" : "full")) : "full") };
  });
}
function missingNoteHTML(part, S){
  const c = (CATALOG[part]||[]).filter(function(x){ return x.s===S; })[0];
  if(!c || !(c.none || c.miss) || curDoc().schema >= 2) return "";
  return '<div class="missnote '+(c.none?'none':'part')+'"><b>'+(c.none ? 'Not extracted yet' : 'Partly extracted')+'</b> &mdash; printed in this section of the PDF but not read by the app: '
    + '<span class="fl">'+(c.none||c.miss).map(escapeHtml).join(" &middot; ")+'</span></div>';
}
function tagHTML(sec){
  if(sec.st==="none") return '<span class="tag n">not extracted</span>';
  if(sec.st==="partial") return '<span class="tag p">partial</span>';
  if(sec.empty) return '<span class="tag e">none declared</span>';
  return "";
}

function renderNav(){
  const el = document.getElementById("navTree");
  const doc = DOCS[state.doc];
  let html = "";
  NAV.forEach(function(p){
    html += '<div class="part-label">'+p.label+'</div>';
    if(p.part==="II" || p.part==="III"){
      html += '<div class="inv-tabs">' + doc.invoices.map(function(inv,i){
        const active = (state.invIdx===i && state.part===p.part) ? "active" : "";
        return '<button class="inv-tab '+active+'" onclick="go(\''+p.part+'\',\''+(state.part===p.part?state.section:"A")+'\',{invIdx:'+i+'})">Inv '+inv.sno+'/'+doc.invoices.length+invDot(i)+'</button>';
      }).join("") + '</div>';
    }
    sectionsFor(p, doc).forEach(function(sec){
      const active = state.part===p.part && state.section===sec.s;
      let extra = "";
      if(p.part==="II" && sec.s==="E"){ extra = ' ('+doc.invoices[state.invIdx].items.length+')'; }
      html += '<button class="sec-btn '+(active?"active":"")+(sec.st==="none"?" none":"")+'" onclick="go(\''+p.part+'\',\''+sec.s+'\')">'+sec.l+extra
        + tagHTML(sec) + navCount(p.part, sec.s, (p.part==="II"||p.part==="III") ? state.invIdx : -1)+'</button>';
    });
  });
  el.innerHTML = html;
}

/* ============================================================
   SOURCE PDF PANE (side-by-side comparison)
   All pages are laid out in one continuous scroll (sizes come from the server, images load lazily as you scroll).
   Clicking a field jumps to the page it came from and highlights where its value is printed. The pane element is
   kept across re-renders so editing a field does not reset your place in the PDF.
   Needs the PDF on the server (uploads keep theirs; the sample bills use app/samples/D1.pdf and D2.pdf).
   ============================================================ */
const PDF_OPEN_KEY = "boe_pdf_open";
const PDFV = { open:false, page:1, zoom:1, hl:null, lastSec:"", seq:0, info:{}, timer:0 };
try{ PDFV.open = localStorage.getItem(PDF_OPEN_KEY)==="1"; }catch(e){}
const ICON_PDF = '<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M14 3H7a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2V8z"/><path d="M14 3v5h5"/><path d="M9 13h6"/><path d="M9 17h4"/></svg>';

function pdfAvailable(key){
  const r = RAW[key];
  if(!r || !API.available) return false;
  return r.uploaded ? !!r.hasPdf : API.samplePdfs.indexOf(key) >= 0;
}
function pdfId(key){ const r = RAW[key]; return r.uploaded ? r.id : key; }
function pdfUrl(key, what){ return "/api/pdf/"+pdfId(key)+"/"+what; }
function showPdf(){ return state.page==="detail" && PDFV.open && pdfAvailable(state.doc); }

function togglePdf(){
  PDFV.open = !PDFV.open; PDFV.lastSec = ""; PDFV.hl = null;
  try{ localStorage.setItem(PDF_OPEN_KEY, PDFV.open ? "1" : "0"); }catch(e){}
  const y = window.scrollY; render(); window.scrollTo(0, y);
}
function pdfToggleHTML(key){
  if(!API.available) return "";
  if(!pdfAvailable(key)){
    return RAW[key] && RAW[key].uploaded
      ? '<div class="pdf-na">Source PDF was not kept for this bill. Upload it again to compare side by side.</div>' : "";
  }
  return '<button class="pdf-toggle'+(PDFV.open?' on':'')+'" onclick="togglePdf()">'+ICON_PDF+'<span>'+(PDFV.open?'Hide source PDF':'Show source PDF')+'</span></button>';
}
function pdfPaneHTML(){
  const key = state.doc;
  return '<aside class="pdfpane" id="pdfpane" data-key="'+key+'"><div class="pdf-head"><div class="pdf-title">Source PDF</div><div class="pdf-ctrl">'
    + '<button onclick="pdfStep(-1)" title="Previous page">&lsaquo;</button><span id="pdfPg" class="pg"></span><button onclick="pdfStep(1)" title="Next page">&rsaquo;</button>'
    + '<span class="sep"></span><button onclick="pdfZoom(-0.2)" title="Zoom out">&minus;</button><button onclick="pdfZoom(0.2)" title="Zoom in">+</button>'
    + '<button onclick="pdfZoom(0)" title="Fit to width">Fit</button>'
    + '<a class="pdf-open" href="'+pdfUrl(key,"file")+'" target="_blank" rel="noopener" title="Open the PDF in a new tab">Open &#8599;</a>'
    + '<button onclick="togglePdf()" title="Close">&times;</button></div></div>'
    + '<div class="pdf-scroll" id="pdfScroll"><div id="pdfPages"></div><div class="pdf-msg" id="pdfMsg" hidden>Could not load the PDF.</div></div></aside>';
}

/* ---- build / lay out ---- */
function pdfScroller(){ return document.getElementById("pdfScroll"); }
function pdfPageEl(n){ return document.getElementById("pg"+n); }
function pdfCount(){ const i = PDFV.info[state.doc]; return i ? i.pages : 1; }

function pdfBuild(key){                                 // lay out every page as an empty, correctly-sized box
  const wrap = document.getElementById("pdfPages"), pane = document.getElementById("pdfpane");
  if(!wrap || !pane) return;
  const sizes = PDFV.info[key].sizes;
  wrap.innerHTML = ""; wrap.style.width = (PDFV.zoom*100)+"%";
  sizes.forEach(function(sz, i){
    const n = i+1, d = document.createElement("div");
    d.className = "pdf-page"; d.id = "pg"+n; d.dataset.n = n;
    d.style.paddingBottom = (sz[1]/sz[0]*100)+"%";
    d.innerHTML = '<img alt="Page '+n+'"><div class="hl"></div><span class="pn">'+n+'</span>';
    wrap.appendChild(d);
  });
  const sc = pdfScroller();
  if(!sc.dataset.wired){
    sc.dataset.wired = "1";
    sc.addEventListener("scroll", function(){
      if(PDFV.timer) return;
      PDFV.timer = setTimeout(function(){ PDFV.timer = 0; pdfTrack(); pdfLoadVisible(); }, 60);
    });
  }
  pdfLoadVisible();
  pane.dataset.built = key;
}
function pdfEnsure(after){                              // make sure the pane for this bill is laid out, then run `after`
  const key = state.doc, pane = document.getElementById("pdfpane");
  if(!pane) return;
  const run = function(){
    if(!showPdf() || state.doc!==key) return;
    if(pane.dataset.built!==key) pdfBuild(key);
    if(after) after();
  };
  if(PDFV.info[key]){ run(); return; }
  fetch(pdfUrl(key,"info")).then(function(r){ return r.json(); }).then(function(j){
    if(!j.sizes) throw new Error(j.error||"no info");
    PDFV.info[key] = j; run();
  }).catch(function(){ const m = document.getElementById("pdfMsg"); if(m){ m.textContent = "Could not load the PDF."; m.hidden = false; } });
}

/* ---- lazy loading: a page fetches its image only when it is near the viewport ---- */
function pdfLoadVisible(){
  const sc = pdfScroller(); if(!sc) return;
  const sr = sc.getBoundingClientRect(), pad = 1500;
  document.querySelectorAll("#pdfPages .pdf-page").forEach(function(p){
    const r = p.getBoundingClientRect();
    if(r.bottom < sr.top - pad || r.top > sr.bottom + pad) return;
    const img = p.querySelector("img");
    if(img.getAttribute("src")) return;
    img.addEventListener("error", function(){ document.getElementById("pdfMsg").hidden = false; }, { once:true });
    img.src = pdfUrl(state.doc, "page/"+p.dataset.n+".png")+"?w="+Math.min(2200, Math.round(1100*PDFV.zoom));
  });
}

/* ---- position ---- */
function pdfTrack(){                                    // which page is in view -> counter
  const sc = pdfScroller(); if(!sc) return;
  const probe = sc.getBoundingClientRect().top + sc.clientHeight/3;
  let cur = PDFV.page;
  const pages = document.querySelectorAll("#pdfPages .pdf-page");
  for(let i=0;i<pages.length;i++){
    const r = pages[i].getBoundingClientRect();
    if(r.top <= probe && r.bottom > probe){ cur = i+1; break; }
  }
  PDFV.page = cur; pdfLabel();
}
function pdfLabel(){ const l = document.getElementById("pdfPg"); if(l) l.textContent = "Page "+PDFV.page+" / "+pdfCount(); }
function pdfScrollToPage(n){
  const sc = pdfScroller(), el = pdfPageEl(n); if(!sc || !el) return;
  PDFV.page = n; pdfLabel();
  sc.scrollTop = el.getBoundingClientRect().top - sc.getBoundingClientRect().top + sc.scrollTop - 8;
  pdfTrack(); pdfLoadVisible();
}
function pdfStep(d){ pdfScrollToPage(Math.max(1, Math.min(PDFV.page+d, pdfCount()))); }
function pdfZoom(dz){
  const sc = pdfScroller(); if(!sc) return;
  const ratio = sc.scrollTop / Math.max(1, sc.scrollHeight);
  PDFV.zoom = dz===0 ? 1 : Math.max(0.5, Math.min(2.5, Math.round((PDFV.zoom+dz)*100)/100));
  pdfBuild(state.doc); drawHl(false);
  sc.scrollTop = ratio * sc.scrollHeight; pdfTrack(); pdfLoadVisible();
}

/* ---- highlight ---- */
function drawHl(scroll){
  document.querySelectorAll("#pdfPages .hl").forEach(function(h){ h.innerHTML = ""; });
  const h = PDFV.hl; if(!h) return;
  const box = document.querySelector("#pg"+h.page+" .hl"); if(!box) return;
  h.rects.forEach(function(r){
    const d = document.createElement("div"); d.className = "pdf-hl";
    d.style.cssText = "left:"+(r[0]*100)+"%;top:"+(r[1]*100)+"%;width:"+((r[2]-r[0])*100)+"%;height:"+((r[3]-r[1])*100)+"%";
    box.appendChild(d);
  });
  const first = box.firstChild, sc = pdfScroller();
  if(scroll!==false && first && sc){
    const fr = first.getBoundingClientRect(), sr = sc.getBoundingClientRect();
    sc.scrollTop = Math.max(0, fr.top - sr.top + sc.scrollTop - sc.clientHeight/3);
    sc.scrollLeft = Math.max(0, fr.left - sr.left + sc.scrollLeft - sc.clientWidth/2);
    pdfTrack(); pdfLoadVisible();
  }
}

/* ---- which page(s) hold a field, and what to search for ---- */
function rowPageFor(path, doc){
  const rows = (doc.pageMap && doc.pageMap.rows) || {}, t = path.split(".");
  for(let n=t.length; n>=2; n--){ const p = rows[t.slice(0,n).join(".")]; if(p) return p; }
  return null;
}
function sectionPages(path, doc){
  const pm = doc.pageMap; if(!pm) return [];
  const L = locate(path, doc); if(!L) return [];
  if(L[0]==="II" || L[0]==="III"){ return (pm[L[0]] && pm[L[0]][String(L[2])]) || []; }
  return pm[L[0]] || [];
}
function candidatePages(path, doc){
  const exact = rowPageFor(path, doc), sec = sectionPages(path, doc);
  return exact ? [exact].concat(sec.filter(function(p){ return p!==exact; })) : sec;
}
function uniq(a){ return a.filter(function(x,i){ return x && a.indexOf(x)===i; }); }
const MONTHS = ["jan","feb","mar","apr","may","jun","jul","aug","sep","oct","nov","dec"];
function searchVariants(v){
  if(v===null||v===undefined||v==="") return [];
  if(typeof v==="number"){
    if(Number.isInteger(v) && Math.abs(v) < 10) return [];            // too common on a page to point at anything
    const out = [String(v), v.toFixed(2)];
    if(Math.abs(v)>=1000) out.push(v.toLocaleString("en-US",{minimumFractionDigits:2,maximumFractionDigits:2}));
    return uniq(out);
  }
  if(typeof v==="object") return [];
  const s = String(v).trim(); if(s.length < 3) return [];             // one- or two-character flags match everywhere
  const m = s.match(/^(\d{2})-([A-Za-z]{3})-(\d{4})$/);             // 14-Feb-2026 -> how the PDF prints dates
  if(m){
    const mm = String(MONTHS.indexOf(m[2].toLowerCase())+1).padStart(2,"0");
    return uniq([m[1]+"/"+mm+"/"+m[3], m[1]+"-"+m[2].toUpperCase()+"-"+m[3].slice(2), m[1]+"-"+mm+"-"+m[3], s]);
  }
  const words = s.split(/\s+/), out = [s];
  if(words.length>3) out.push(words.slice(0,3).join(" "));
  const longest = words.slice().sort(function(a,b){ return b.length-a.length; })[0];
  if(longest && longest.length>=5) out.push(longest);
  return uniq(out);
}
async function pdfFocus(path, pagesOverride){
  if(!showPdf()) return;
  const doc = RAW[state.doc], pages = pagesOverride || candidatePages(path, doc);
  if(!pages.length) return;
  const my = ++PDFV.seq;
  PDFV.hl = null; drawHl(false);
  pdfEnsure(function(){ pdfScrollToPage(pages[0]); });                // go to the likeliest page straight away
  const variants = searchVariants(pathGet(doc, path));
  if(!variants.length) return;
  try{
    const r = await (await fetch(pdfUrl(state.doc,"find")+"?pages="+pages.join(",")+"&q="+encodeURIComponent(variants.join("||")))).json();
    if(my!==PDFV.seq) return;                                       // a newer click superseded this one
    if(r.page){ PDFV.hl = { page:r.page, rects:r.rects }; pdfEnsure(function(){ drawHl(true); }); }
  }catch(e){}
}
function pdfSync(){                                                 // after every render: follow the section being viewed
  if(!showPdf()) return;
  const doc = RAW[state.doc], k = state.doc+"|"+state.part+"|"+state.section+"|"+state.invIdx;
  const changed = PDFV.lastSec!==k;
  PDFV.lastSec = k;
  if(!changed){ pdfEnsure(function(){ pdfLabel(); drawHl(false); }); return; }   // e.g. after an edit: keep the place
  if(state.part==="IV" && (state.section==="CONT" || state.section==="INVD")){
    const rp = state.section==="CONT" ? "containers.0.containerNumber" : "invoices.0.no";
    if(pathGet(doc, rp)!==undefined && pathGet(doc, rp)!==null){ PDFV.hl = null; pdfFocus(rp, (doc.pageMap && doc.pageMap.IV) || []); return; }
  }
  const rep = { I:"boe.beNo", II:"invoices."+state.invIdx+".no", III:"invoices."+state.invIdx+".duties",
                IV:"supportingDocs.0.irn", V:"compliance.examOrder", VI:"signatory.chaName" }[state.part];
  const pages = rep ? sectionPages(rep, doc) : [];
  PDFV.hl = null;
  pdfEnsure(function(){ drawHl(false); if(pages.length) pdfScrollToPage(pages[0]); else pdfLabel(); });
}
function rowClick(ev, el){
  if(ev.target.closest(".fmeta") || el.classList.contains("editing")) return;
  pdfFocus(el.dataset.path);
}

/* ============================================================
   FIELD EDITING + CONFIDENCE
   Every displayed value carries a data-path into the bill (e.g. invoices.0.valuation.freight).
   Confidence per path lives in doc.conf; edits are kept in doc.edits so they can be reverted.
   Uploaded bills save edits to the server; the two sample bills keep theirs in this browser.
   ============================================================ */
const LOW_BELOW = 0.8, VLOW_BELOW = 0.5;
const SAMPLE_EDITS_KEY = "boe_sample_edits";
const ICON_EDIT = '<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 20h4L19 9l-4-4L4 16z"/><path d="M13.5 6.5l4 4"/></svg>';
let ACTIVE = null;      // the editor currently open: { el, prev }
let LOWMAP = {};        // "part|section|inv" -> number of low-confidence fields (for the left menu)

function pathGet(obj, path){
  let o = obj; const t = path.split(".");
  for(let i=0;i<t.length;i++){ if(o===null||o===undefined) return undefined; o = o[t[i]]; }
  return o;
}
function pathSet(obj, path, val){
  const t = path.split("."); let o = obj;
  for(let i=0;i<t.length-1;i++){ o = o[t[i]]; if(o===null||o===undefined||typeof o!=="object") return false; }
  o[t[t.length-1]] = val; return true;
}
function curDoc(){ return DOCS[state.doc]; }
function curRaw(){ return RAW[state.doc]; }

function confOf(path){ const c = curDoc().conf; return c ? c[path] : undefined; }
function confClass(c){
  if(!c) return "";
  if(c.b==="edited") return "c-edited";
  return c.s < VLOW_BELOW ? "c-vlow" : (c.s < LOW_BELOW ? "c-low" : "c-ok");
}
function confLevel(s){ return s < VLOW_BELOW ? "Low" : (s < LOW_BELOW ? "Medium" : "High"); }
function isRated(){ const d = curDoc(); return !!(d && d.rated); }       // bills read since ratings were added carry one for every value
function confTip(c){
  if(!c) return isRated() ? "" : "Not rated when this bill was read. Upload it again to get an AI confidence rating.";
  if(c.b==="edited") return "Edited by you";
  const q = curDoc().quality;
  const base = c.b==="checked"
    ? "Found on the page and passed the cross-checks"+((q&&q.evaluator)?", audited by a second model":"")
    : (c.b==="model" ? "Rated by the AI (too generic to confirm against the PDF text)" : "Matched against the PDF text");
  return base+": "+confLevel(c.s)+((c.r&&c.r.length) ? "\n"+c.r.join("\n") : "");
}
function confPill(c, empty){
  if(!c){
    if(empty || isRated()) return "";                       // nothing was extracted (or it is a structural label): nothing to rate
    return '<span class="cpill c-unrated" title="'+confTip(c)+'">Medium</span>';
  }
  const label = c.b==="edited" ? "edited" : confLevel(c.s);
  return '<span class="cpill '+confClass(c)+'" title="'+confTip(c)+'">'+label+'</span>';
}

/* ---- one labelled field row (editable when it has a path) ---- */
function row(no,label,value,path,opts){
  opts = opts||{};
  const empty = (value===null||value===undefined||value==="");
  const v = empty ? '<span class="empty">— not declared</span>' : value;
  if(!path){
    return '<div class="field-row"><div class="fno">'+(no||"")+'</div><div class="flabel">'+label+'</div><div class="fvalue">'+v+'</div></div>';
  }
  const c = confOf(path);
  return '<div class="field-row editable '+confClass(c)+'" data-path="'+path+'"'+(opts.multi?' data-multi="1"':'')+' onclick="rowClick(event,this)">'
    + '<div class="fno">'+(no||"")+'</div><div class="flabel">'+label+'</div><div class="fvalue">'+v+'</div>'
    + '<div class="fmeta">'+confPill(c, empty)+'<button class="fedit" title="Edit this field" onclick="editField(this)">'+ICON_EDIT+'</button></div></div>';
}
/* Fld reads the value itself: opts.fmt custom formatter, opts.raw plain number, opts.multi long text */
function Fld(no,label,path,opts){
  opts = opts||{};
  const raw = pathGet(curDoc(), path);
  let shown = raw;
  if(opts.fmt) shown = opts.fmt(raw);
  else if(typeof raw==="number") shown = opts.raw ? String(raw) : fmt(raw);
  return row(no,label,shown,path,opts);
}
function sheetRows(list){ return list.map(function(r){ return Fld(r[0], r[1], r[2], r[3]); }).join(""); }

/* ---- table cells: editable (ecell) or read-only (rcell) ---- */
function cellHTML(path, shown, cls, editable){
  const c = confOf(path);
  const empty = (shown===null||shown===undefined||shown==="");
  return '<td class="'+(editable?'ecell ':'rcell ')+(cls||"")+' '+confClass(c)+'" data-path="'+path+'" title="'+(empty?"":confTip(c))+(editable?'\nClick to edit':'')+'"'
    + (editable ? ' onclick="editCell(this)"' : '') + '>' + (empty ? '<span class="empty">&mdash;</span>' : shown) + '</td>';
}
function ecell(path, shown, cls){ return cellHTML(path, shown, cls, true); }
function rcell(path, shown, cls){ return cellHTML(path, shown, cls, false); }
function tbl(head, bodyRows, extra){
  return '<div class="items-wrap"><table class="items"><thead><tr>'+head.map(function(h){ return '<th>'+h+'</th>'; }).join("")
    + '</tr></thead><tbody>'+bodyRows+'</tbody>'+(extra||"")+'</table></div>';
}

/* ---- editor open / close ---- */
function closeEditor(){
  if(!ACTIVE) return;
  ACTIVE.el.innerHTML = ACTIVE.prev; ACTIVE.el.classList.remove("editing"); ACTIVE = null;
}
function editorHTML(path, multi){
  const raw = pathGet(curRaw(), path);
  const val = (raw===null||raw===undefined) ? "" : String(raw);
  const big = multi || val.length>70 || val.indexOf("\n")>=0;
  const rec = (curRaw().edits||{})[path];
  return (big ? '<textarea class="ein" rows="3">'+escapeHtml(val)+'</textarea>'
              : '<input class="ein" type="text" value="'+escapeHtml(val)+'">')
    + '<div class="ebtns"><button class="btn primary" data-act="save">Save</button><button class="btn" data-act="cancel">Cancel</button>'
    + (rec ? '<button class="btn" data-act="revert">Revert to extracted value</button>' : '') + '</div>'
    + '<div class="eerr"></div>'
    + (rec ? '<div class="eorig">Extracted value: '+escapeHtml(rec.orig===null||rec.orig===undefined ? "(blank)" : String(rec.orig))+'</div>' : '')
    + '<span class="big" hidden>'+(big?1:0)+'</span>';
}
function wireEditor(el, path){
  const inp = el.querySelector(".ein"); const big = el.querySelector(".big").textContent==="1";
  inp.focus(); inp.select();
  inp.addEventListener("keydown", function(e){
    if(e.key==="Escape"){ e.preventDefault(); closeEditor(); }
    else if(e.key==="Enter" && (!big || e.ctrlKey || e.metaKey)){ e.preventDefault(); commitEdit(path, inp.value, el); }
  });
  el.querySelectorAll("[data-act]").forEach(function(b){
    b.addEventListener("click", function(e){
      e.stopPropagation();
      const a = b.dataset.act;
      if(a==="save") commitEdit(path, inp.value, el);
      else if(a==="cancel") closeEditor();
      else if(a==="revert") revertEdit(path, el);
    });
  });

/* ---- apply / persist ---- */
const NUMLEAF = /(freight|invoiceValue|loading|commission|miscCharge|assessValue|amount|bcd|sws|igst|totalDuty|totalAssessableValue|totalAmount|totalInvoices|totalItems|totalContainers|totalPackages|packages)/i;
function coerce(orig, text, path){
  const t = text.trim();
  if(t==="") return null;
  const leaf = path.split(".").pop();
  const numeric = (typeof orig==="number") || ((orig===null||orig===undefined) && NUMLEAF.test(leaf) && /^-?[\d,]*\.?\d+$/.test(t));
  if(numeric){
    const n = Number(t.replace(/,/g,""));
    if(!isFinite(n)) throw new Error("Please enter a number.");
    return n;
  }
  return t;
}
function applyLocalEdit(raw, path, value, revert){
  raw.edits = raw.edits||{}; raw.conf = raw.conf||{};
  const cur = pathGet(raw, path); const curv = (cur===undefined) ? null : cur;
  if(revert){
    const rec = raw.edits[path]; if(!rec) return;
    pathSet(raw, path, rec.orig);
    if(rec.origConf==null) delete raw.conf[path]; else raw.conf[path] = rec.origConf;
    delete raw.edits[path]; return;
  }
  const rec = raw.edits[path] || { orig: curv, origConf: raw.conf[path]||null };
  pathSet(raw, path, value);
  if(value===rec.orig){
    delete raw.edits[path];
    if(rec.origConf==null) delete raw.conf[path]; else raw.conf[path] = rec.origConf;
  } else {
    rec.at = new Date().toISOString().slice(0,19).replace("T"," ");
    raw.edits[path] = rec; raw.conf[path] = { s:1, b:"edited", r:[] };
  }
}
function persistSample(key){
  const raw = RAW[key]; const out = {};
  Object.keys(raw.edits||{}).forEach(function(p){
    const e = raw.edits[p]; out[p] = { orig:e.orig, origConf:e.origConf||null, at:e.at||"", value:pathGet(raw,p) };
  });
  let all = {};
  try{ all = JSON.parse(localStorage.getItem(SAMPLE_EDITS_KEY)||"{}"); }catch(e){}
  if(Object.keys(out).length) all[key] = out; else delete all[key];
  try{ localStorage.setItem(SAMPLE_EDITS_KEY, JSON.stringify(all)); }catch(e){}
}
function editErr(el, msg){
  const e = el && el.querySelector ? el.querySelector(".eerr") : null;
  if(e) e.textContent = msg; else toast(msg);
}
async function sendEdit(raw, body){
  if(!raw.uploaded) return;
  const r = await fetch("/api/docs/"+raw.id+"/edit", { method:"POST", headers:{ "Content-Type":"application/json" }, body:JSON.stringify(body) });
  const j = await r.json().catch(function(){ return {}; });
  if(!r.ok) throw new Error(j.error || ("HTTP "+r.status));
}
async function commitEdit(path, text, el){
  const key = state.doc, raw = RAW[key];
  let val;
  try{ val = coerce(pathGet(raw, path), text, path); }catch(e){ return editErr(el, e.message); }
  const cur = pathGet(raw, path);
  if((cur===undefined ? null : cur) === val){ closeEditor(); return; }
  try{ await sendEdit(raw, { path:path, value:val }); }catch(e){ return editErr(el, e.message); }
  applyLocalEdit(raw, path, val, false);
  afterEdit(key, path);
}
async function revertEdit(path, el){
  const key = state.doc, raw = RAW[key];
  try{ await sendEdit(raw, { path:path, revert:true }); }catch(e){ return editErr(el, e.message); }
  applyLocalEdit(raw, path, null, true);
  afterEdit(key, path);
}
function afterEdit(key, path){
  if(!RAW[key].uploaded) persistSample(key);
  DOCS[key] = deepEscape(RAW[key]);
  ACTIVE = null;
  const y = window.scrollY; render(); window.scrollTo(0, y);
  const el = document.querySelector('[data-path="'+path+'"]'); if(el) el.classList.add("flash");
}

/* ---- confidence summary: left-menu counts, review bar, "review next" ---- */
function lowPaths(doc){
  const out = [], c = doc.conf||{};
  Object.keys(c).forEach(function(p){ if(c[p].b!=="edited" && c[p].s < LOW_BELOW) out.push(p); });
  return out;
}
function locate(path, doc){
  const t = path.split("."), h = t[0];
  const top = { boe:["I","HDR"], status:["I","A"], declarant:["I","B"], dutySummary:["I","C"], manifest:["I","D"], payments:["I","F"],
    events:["I","H"], processing:["I","H"], containers:["I","J"], supportingDocs:["IV","M"], declarations:["VI","A"], signatory:["VI","B"] };
  if(top[h]) return top[h];
  if(h==="invoices"){
    const i = +t[1], k = t[2];
    if(k==="parties") return ["II","B",i];
    if(k==="valuation") return ["II","C",i];
    if(k==="cost") return ["II","D",i];
    if(k==="items") return ["II","E",i];
    if(k==="duties") return ["III", dutySection(t[4]), i];
    return ["II","A",i];
  }
  if(h==="additional"){ const a = doc.additional && doc.additional[+t[1]]; return a ? ["IV", a.code] : null; }
  if(h==="compliance"){
    const f = t[1];
    if(f==="oocNo" || f==="oocDate") return ["V","C"];
    if(["compliances","acRemarks","examReport","superintendentComments"].indexOf(f)>=0) return ["V","B"];
    return ["V","A"];
  }
  return null;
}
function computeLow(doc){
  LOWMAP = {};
  lowPaths(doc).forEach(function(p){
    const L = locate(p, doc); if(!L) return;
    const inv = (L[2]===undefined) ? -1 : L[2];
    [L[0]+"|"+L[1]+"|"+inv, L[0]+"|*|"+inv].forEach(function(k){ LOWMAP[k] = (LOWMAP[k]||0) + 1; });
  });
}
function navCount(part, section, inv){
  const n = LOWMAP[part+"|"+section+"|"+inv] || 0;
  return n ? '<span class="navdot" title="'+n+' low-confidence field'+(n===1?'':'s')+'">'+n+'</span>' : '';
}
let reviewIdx = 0;
function reviewNext(){
  const doc = curDoc(), lows = lowPaths(doc); if(!lows.length) return;
  reviewIdx = reviewIdx % lows.length;
  const p = lows[reviewIdx++], L = locate(p, doc); if(!L) return;
  state.part = L[0]; state.section = L[1]; state.itemIdx = null;
  if(L[2]!==undefined) state.invIdx = L[2];
  render();
  setTimeout(function(){
    const el = document.querySelector('[data-path="'+p+'"]');
    if(el){ el.scrollIntoView({ block:"center" }); el.classList.add("flash"); }
  }, 30);
}
function reviewBarHTML(doc){
  const low = lowPaths(doc).length, ed = Object.keys(doc.edits||{}).length, scored = Object.keys(doc.conf||{}).length;
  const legend = '<span class="lg"><i class="sw c-low"></i>Medium</span><span class="lg"><i class="sw c-vlow"></i>Low</span><span class="lg"><i class="sw c-edited"></i>edited</span>';
  return '<div class="rbar '+(low?'warn':'ok')+'"><div class="rtxt">'
    + (low ? '<b>'+low+' field'+(low===1?'':'s')+' rated Medium or Low</b>' : '<b>No Medium or Low fields</b>')
    + ' &middot; '+scored+' scored'+(ed ? ' &middot; '+ed+' edited' : '')
    + '</div><div class="rbtns">'+(low ? '<button class="btn" onclick="reviewNext()">Review next &rsaquo;</button>' : '')+legend+'</div></div>';
}

/* ---- sample bills: attach saved scores and any edits kept in this browser ---- */
function initDocs(){
  let saved = {};
  try{ saved = JSON.parse(localStorage.getItem(SAMPLE_EDITS_KEY)||"{}"); }catch(e){}
  Object.keys(DOCS).forEach(function(k){
    const raw = JSON.parse(JSON.stringify(DOCS[k]));
    raw.edits = {}; raw.conf = {};
    const bc = (typeof BUILTIN_CONF!=="undefined" && BUILTIN_CONF[k]) || {};
    Object.keys(bc).forEach(function(p){
      const a = bc[p];
      raw.conf[p] = { s:a[0], b:(a[1]==="c" ? "checked" : "text"), r:(a[2] ? [a[2]] : []) };
    });
    (raw.declarations||[]).forEach(function(d){ if(d.text===undefined) d.text = TXT[d.key]||""; });
    const sv = saved[k]||{};
    Object.keys(sv).forEach(function(p){
      const e = sv[p];
      if(!pathSet(raw, p, e.value)) return;
      raw.edits[p] = { orig:e.orig, origConf:e.origConf||null, at:e.at||"" };
      raw.conf[p] = { s:1, b:"edited", r:[] };
    });
    if(typeof BUILTIN_LETTERS!=="undefined" && BUILTIN_LETTERS[k]){ raw.sectionLetters = BUILTIN_LETTERS[k]; }
    if(typeof BUILTIN_PAGES!=="undefined" && BUILTIN_PAGES[k]){ raw.pageMap = BUILTIN_PAGES[k].pageMap; raw.pageCount = BUILTIN_PAGES[k].pageCount; }
    RAW[k] = raw; DOCS[k] = deepEscape(raw);
  });
}

    return;
  }

  /* ---------------- Part III ---------------- */
  if(P==="III"){
    const d = inv.duties || {};
    const ks = Object.keys(d).sort(function(a,b){ return a-b; });
    const cat = CATALOG.III.filter(function(x){ return x.s===S; })[0] || CATALOG.III[0];
    const ttl = (cat.L ? cat.L+". " : "")+cat.l;
    const tail = " — Invoice "+inv.sno+"/"+doc.invoices.length;
    const h = head("III — Duties", "Invoice "+inv.sno+"/"+doc.invoices.length+" &middot; "+cat.l, ttl+tail);
    if(!ks.length){ main.innerHTML = h + none("No Part III duty data for this invoice."); return; }
    const raw = function(v){ return (v===null||v===undefined) ? "" : String(v); };      // shown as printed
    if(S==="A"){
      const t = {a:0,d:0};
      ks.forEach(function(k){ t.a += d[k].assessValue||0; t.d += d[k].totalDuty||0; });
      const cols = [["cth","3.CTH","cth"],["ceth","4.CETH"],["description","5.ITEM DESCRIPTION"],["fs","6.FS"],["pq","7.PQ"],["dc","8.DC"],["wc","9.WC"],["aq","10.AQ"],
        ["upi","11.UPI","num"],["coo","12.COO"],["cQty","13.C.QTY","num"],["cUqc","14.C.UQC"],["sQty","15.S.QTY","num"],["sUqc","16.S.UQC"],["sch","17.SCH"],
        ["stndPr","18.STND/PR"],["rsp","19.RSP"],["reimp","20.REIMP"],["prov","21.PROV"],["endUse","22.END USE"],["prodn","23.PRODN"],["cntrl","24.CNTRL"],
        ["qualfr","25.QUALFR"],["contnt","26.CONTNT"],["stmnt","27.STMNT"],["supDocs","28.SUP DOCS"],["assessValue","29.ASSESS VALUE","num"],["totalDuty","30.TOTAL DUTY","num"]];
      const rows = ks.map(function(k){
        const x = d[k], b = ib+".duties."+k;
        return '<tr><td>'+k+'</td>'+cols.map(function(c){ return ecell(b+"."+c[0], raw(x[c[0]]), c[2]||""); }).join("")+'</tr>';
      }).join("");
      const foot = '<tfoot><tr class="tot"><td colspan="'+(cols.length-1)+'">Invoice total ('+ks.length+' items) &mdash; assess value / total duty</td><td class="num">'+fmt(t.a)+'</td><td class="num">'+fmt(t.d)+'</td></tr></tfoot>';
      main.innerHTML = h + '<div class="note" style="margin:6px 0 12px">Printed fields 1&ndash;30 of each item (1.INVSNO is the invoice shown above). Click a cell to edit it.</div>'
        + tbl(["2.ITEMSN"].concat(cols.map(function(c){ return c[1]; })), rows, foot);
    } else {
      const grp = dutyCols(S, d, ks);
      const rowsDef = [["NotnNo","Notn No."],["NotnSno","Notn SNo."],["Rate","Rate"],["Amount","Amount"],["DutyFg","Duty Fg"]];
      const tot = {};
      ks.forEach(function(k){ grp.forEach(function(c){ const v = d[k][c[0]+"Amount"]; if(typeof v==="number") tot[c[0]] = (tot[c[0]]||0) + v; }); });
      const sum = grp.filter(function(c){ return tot[c[0]]!==undefined && c[0]!=="tvalue" && c[0]!=="aggr"; })
        .map(function(c){ return c[1].replace(/^\d+\.\s*/,"")+" "+fmt(tot[c[0]]); }).join(" &middot; ");
      main.innerHTML = h + '<div class="note" style="margin:6px 0 12px">One block per item, laid out as printed (columns = duties, rows = notification, rate, amount, duty foregone). Click a cell to edit it.'
        + (sum ? '<br><b>Invoice totals:</b> '+sum : '')+'</div>'
        + ks.map(function(k){
            const b = ib+".duties."+k;
            const body = rowsDef.map(function(r){
              return '<tr><th class="rl">'+r[1]+'</th>'+grp.map(function(c){
                const v = d[k][c[0]+r[0]]; return ecell(b+"."+c[0]+r[0], raw(v), (r[0]==="NotnNo"||r[0]==="NotnSno") ? "" : "num");
              }).join("")+'</tr>';
            }).join("");
            return '<div class="itemhd">Item '+k+' &middot; '+(d[k].cth||"")+'</div>' + tbl([""].concat(grp.map(function(c){ return c[1]; })), body);
          }).join("");
    }
    return;
  }

  /* ---------------- Part IV ---------------- */
  if(P==="IV" && S==="CONT"){
    const cs = doc.containers || [];
    main.innerHTML = head("IV — Additional details", "Container details", "Container details")
      + (cs.length ? '<div class="note" style="margin:6px 0 12px">Click a cell to edit it. These are the same containers shown under Part I &rsaquo; Containers.</div>'
          + tbl(["Container no.","Truck","Seal","LCL / FCL","Sno"], cs.map(function(c,i){
              const b = "containers."+i;
              return '<tr>'+ecell(b+".containerNumber",c.containerNumber)+ecell(b+".truck",c.truck)+ecell(b+".seal",c.seal)+ecell(b+".lclFcl",c.lclFcl)+ecell(b+".sno",c.sno,"num")+'</tr>';
            }).join(""))
        : none("No containers declared (LCL / not containerised)."));
    return;
  }
  if(P==="IV" && S==="INVD"){
    main.innerHTML = head("IV — Additional details", "Invoice details", "Invoice details")
      + '<div class="note" style="margin:6px 0 12px">Click a cell to edit it. These are the same invoices shown under Part II.</div>'
      + tbl(["S no.","Invoice no.","Invoice amount","Cur"], doc.invoices.map(function(inv,i){
          const b = "invoices."+i;
          return '<tr><td>'+inv.sno+'</td>'+ecell(b+".no",inv.no)+ecell(b+".amount",fmt(inv.amount),"num")+ecell(b+".currency",inv.currency)+'</tr>';
        }).join(""));
    return;
  }
  if(P==="IV"){
    const ai = (doc.additional||[]).map(function(x){ return x.code; }).indexOf(S);
    if(ai>=0){
      const add = doc.additional[ai];
      const rows = add.rows.map(function(r,ri){
        return '<tr>'+r.map(function(c,ci){ return ecell("additional."+ai+".rows."+ri+"."+ci, c); }).join("")+'</tr>';
      }).join("");
      main.innerHTML = head("IV — Additional details", add.title, add.title)
        + '<div class="note" style="margin:6px 0 12px">'+add.rows.length+' row'+(add.rows.length===1?'':'s')+' declared. Click a cell to edit it.</div>'
        + tbl(add.columns, rows);
      return;
    }
    if(S!=="M" && PART4_TITLES[S] && S!=="CONT" && S!=="INVD"){
      main.innerHTML = head("IV — Additional details", PART4_TITLES[S], PART4_TITLES[S])
        + none(Array.isArray(doc.additional) ? "None declared in the PDF for this bill."
               : "Not extracted for this bill. Upload the PDF again to read this section.");
      return;
    }
    const sd = doc.supportingDocs || [];
    const rows = sd.map(function(d,i){
      const b = "supportingDocs."+i;
      return '<tr>'+ecell(b+".type",d.type,"cth")+ecell(b+".docType",d.docType)+ecell(b+".irn",d.irn)+ecell(b+".icegate",d.icegate)
        + ecell(b+".inv",d.inv,"num")+ecell(b+".item",d.item,"num")+ecell(b+".place",d.place)+ecell(b+".date",d.date)+ecell(b+".expiry",d.expiry)+'</tr>';
    }).join("");
    main.innerHTML = head("IV — Additional details", "Supporting documents", "Supporting documents")
      + (sd.length
          ? '<div class="note" style="margin:6px 0 12px">Click a cell to edit it. Invoice / item 0 means the document applies to the whole bill (invoice 0) or the whole invoice (item 0).</div>'
            + tbl(["Doc code","Type","IRN","ICEGATE id","Invoice","Item","Place","Issued","Expires"], rows)
          : none("None declared."));
    return;
  }

  /* ---------------- Part V ---------------- */
  if(P==="V"){
    const label = NAV.filter(function(p){ return p.part==="V"; })[0].sections.filter(function(x){ return x.s===S; })[0].l;
    const h = head("V — Other compliances", label, label);
    const c = doc.compliance;
    if(!c){ main.innerHTML = h + none("Part V was not extracted for this bill. Upload the PDF again to read it."); return; }
    const list = function(no, lab, arr, key){
      if(!arr || !arr.length) return row(no, lab, null);
      return arr.map(function(_, i){ return Fld(i===0?no:"", i===0?lab:"", "compliance."+key+"."+i, {multi:true}); }).join("");
    };
    let body = "";
    if(S==="A"){
      body = Fld("A","Examination order (RMS)","compliance.examOrder",{multi:true}) + Fld("A1","Examination order","compliance.examOrderA1",{multi:true})
        + list("B","Examination instructions",c.examInstructions,"examInstructions");
      const pga = c.pgaInstructions || [];
      main.innerHTML = h + hint + sheet(body)
        + '<h3 class="subtitle">PGA examination instructions</h3>'
        + (pga.length ? tbl(["Invoice","Item","Agency","Status"], pga.map(function(g,i){
            const b = "compliance.pgaInstructions."+i;
            return '<tr>'+ecell(b+".inv",g.inv)+ecell(b+".item",g.item)+ecell(b+".agency",g.agency)+ecell(b+".status",g.status)+'</tr>';
          }).join("")) : none("None declared."));
      return;
    } else if(S==="B"){
      body = list("C","Compulsory compliance",c.compliances,"compliances") + list("D","AC remarks",c.acRemarks,"acRemarks")
        + list("E","Examination report",c.examReport,"examReport") + list("F","Superintendent comments",c.superintendentComments,"superintendentComments");
    } else {
      body = sheetRows([["","OOC no.","compliance.oocNo"],["","OOC date","compliance.oocDate"]]);
    }
    main.innerHTML = h + hint + sheet(body);
    return;
  }

  /* ---------------- Part VI ---------------- */
  if(P==="VI"){
    if(S==="A"){
      main.innerHTML = head("VI — Declaration", "Declaration statements", "Declaration statements") + hint
        + sheet((doc.declarations||[]).map(function(d,i){ return Fld(d["for"], "Declaration "+d["for"], "declarations."+i+".text", {multi:true}); }).join(""));
    } else {
      main.innerHTML = head("VI — Declaration", "Authorized signatory", "Authorized signatory") + hint
        + sheet(sheetRows([["","CHA name","signatory.chaName"],["","Date","signatory.date"],["","Place","signatory.place"]]));
    }
    return;
  }
}
function invDot(i){
  const n = (LOWMAP["II|*|"+i]||0) + (LOWMAP["III|*|"+i]||0);
  return n ? '<span class="navdot sm" title="'+n+' low-confidence field'+(n===1?'':'s')+'">'+n+'</span>' : '';
}

function render(){
  const root = document.getElementById("root");
  if(state.page === "list"){
    root.innerHTML = listPageHTML();
    renderBillTable();
    wireDrop();
    return;
  }
  const doc = DOCS[state.doc];
  const withPdf = showPdf();
  let keptPane = null, keptTop = 0, keptLeft = 0;
  if(withPdf){
    const old = document.getElementById("pdfpane");
    if(old && old.dataset.key===state.doc){
      const osc = old.querySelector("#pdfScroll");
      keptTop = osc ? osc.scrollTop : 0; keptLeft = osc ? osc.scrollLeft : 0;     // removing an element resets its scroll
      keptPane = old; old.remove();
    }
  }
  root.innerHTML = '<div class="app'+(withPdf?' withpdf':'')+'"><aside class="rail">'
    + '<button class="back-btn" onclick="backToList()">&larr; All bills</button>'
    + pdfToggleHTML(state.doc)
    + '<div class="current-bill"><div class="cb-no">'+doc.boe.beNo+'</div><div class="cb-port">'+doc.boe.portCode+' &middot; '+doc.boe.beDate+'</div></div>'
    + '<nav id="navTree"></nav>'
    + '</aside><main id="main"></main>'+(withPdf ? (keptPane ? '<div id="pdfslot"></div>' : pdfPaneHTML()) : '')+'</div>';
  if(keptPane){
    document.getElementById("pdfslot").replaceWith(keptPane);
    const nsc = keptPane.querySelector("#pdfScroll");
    if(nsc){ nsc.scrollTop = keptTop; nsc.scrollLeft = keptLeft; }
  }
  ACTIVE = null;
  computeLow(doc);
  renderNav();
  renderMain();
  const mainEl = document.getElementById("main");
  const h2 = mainEl.querySelector("h2.title");
  if(h2){ h2.insertAdjacentHTML("afterend", missingNoteHTML(state.part, state.section)); }
  mainEl.insertAdjacentHTML("afterbegin", reviewBarHTML(doc));
  if(doc.quality){ mainEl.insertAdjacentHTML("afterbegin", qualityHTML(doc)); }
  pdfSync();
}

function getKey(){ try{ return localStorage.getItem(KEY_STORE)||""; }catch(e){ return ""; } }

/* Live Gemini cost: the server reports each call; print new ones to the browser DevTools console. */
const COST_CSS = { head:"background:#133C84;color:#fff;padding:1px 6px;border-radius:3px;font-weight:600", usd:"color:#1E6B3A;font-weight:700" };
function logCost(c, seen, file, final){
  if(!c) return seen;
  (c.events||[]).slice(seen).forEach(function(e){
    console.log("%ccost%c "+e.stage.padEnd(22)+" "+e.model.padEnd(22)+" in "+e.in.toLocaleString().padStart(7)+"  out "+e.out.toLocaleString().padStart(7)
      +"  %c"+(e.usd===null?"unpriced":"$"+e.usd.toFixed(4))+"%c   | running total $"+e.totalUsd.toFixed(4),
      COST_CSS.head, "", COST_CSS.usd, "");
  });
  if(final){
    console.log("%ccost%c "+file+": "+c.calls+" calls, "+c.inputTokens.toLocaleString()+" input + "+c.outputTokens.toLocaleString()+" output tokens = %c$"+c.usd.toFixed(4)
      +(c.unpricedCalls?"%c (+"+c.unpricedCalls+" unpriced calls)":"%c"), COST_CSS.head, "", COST_CSS.usd, "");
    const rows={}; Object.keys(c.byModel||{}).forEach(function(m){ const v=c.byModel[m]; rows[m]={calls:v.calls, inputTokens:v.input, outputTokens:v.output, usd:v.usd}; });
    console.table(rows);
  }
  return (c.events||[]).length;
}
