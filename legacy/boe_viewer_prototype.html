<!doctype html>
<meta charset="utf-8">
<title>Bill of Entry Explorer — Maruti Suzuki</title>
<style>
:root{
  --paper:#FFFFFF; --paper-2:#F2F8FD; --ink:#122237; --ink-soft:#5C7089;
  --blue:#1950B1; --blue-deep:#133C84; --blue-pale:#DCE7F5; --line:#D9E7F3;
  --line-soft:#EDF5FC; --danger:#B23B3B; --red:#E20916;
  --sans:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
  --mono:ui-monospace,"SFMono-Regular",Menlo,Consolas,"Liberation Mono",monospace;
}
*{box-sizing:border-box;}
html,body{ background:var(--paper); }
body{
  margin:0; color:var(--ink); font-family:var(--sans); font-size:15px; line-height:1.5;
  padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
}

/* ---------- header ---------- */
.topbar{
  background:var(--blue-pale);
  border-bottom:1px solid var(--line);
  box-shadow:0 2px 10px rgba(19,60,132,.09);
  padding:14px clamp(20px, 4vw, 40px);
  position:relative; z-index:2;
}
.topbar-inner{ max-width:1400px; margin:0 auto; display:flex; align-items:center; justify-content:space-between; gap:16px; }
.topbar-brand{ display:flex; align-items:center; gap:16px; }
.logo-img{ height:40px; width:auto; display:block; flex:0 0 auto; }
.topbar-divider{ width:1px; height:34px; background:var(--line); }
.topbar-text .company{ font-weight:700; font-size:16.5px; color:var(--blue-deep); }
.topbar-text .appname{ font-size:12.5px; color:var(--ink-soft); margin-top:1px; }
.topbar-meta{
  font-size:11.5px; letter-spacing:.04em; color:var(--blue);
  background:#fff; border:1px solid var(--line); border-radius:20px;
  padding:5px 14px; white-space:nowrap;
}
@media (max-width:640px){ .topbar{ padding:10px 16px; } .topbar-meta{ display:none; } .logo-img{ height:32px; } }

/* ---------- list page ---------- */
.list-page{ width:92%; max-width:1320px; margin:0 auto; padding:40px 0 80px; }
.list-header{ display:flex; align-items:center; justify-content:space-between; gap:24px; flex-wrap:wrap; margin-bottom:26px; }
.title-block{ display:flex; align-items:center; gap:14px; }
.title-accent{ width:5px; height:32px; background:var(--red); border-radius:3px; flex:0 0 5px; }
.list-page h1{ font-size:32px; margin:0; font-weight:700; color:var(--blue-deep); letter-spacing:-.01em; }
.search-bar{ position:relative; width:300px; max-width:100%; }
@media (max-width:640px){
  .list-header{ flex-direction:column; align-items:stretch; gap:14px; }
  .search-bar{ width:100%; }
}
.search-bar svg{ position:absolute; left:13px; top:50%; transform:translateY(-50%); width:16px; height:16px; color:var(--ink-soft); pointer-events:none; }
.search-bar input{
  width:100%; padding:11px 14px 11px 38px; border:1px solid var(--line); border-radius:8px;
  background:#fff; color:var(--ink); font-size:14px; font-family:var(--sans);
}
.search-bar input:focus{ outline:none; border-color:var(--blue); box-shadow:0 0 0 3px var(--blue-pale); }
.search-bar input::placeholder{ color:var(--ink-soft); }
.no-results{ padding:30px 22px; color:var(--ink-soft); font-size:14px; text-align:center; }
.stats-strip{ display:flex; gap:16px; margin-bottom:28px; flex-wrap:wrap; }
.stat-card{ flex:0 1 260px; background:#fff; border:1px solid var(--line); border-radius:10px; padding:18px 20px; }
.stat-card .stat-label{ font-size:12px; color:var(--ink-soft); font-weight:600; }
.stat-card .stat-value{ font-size:25px; font-weight:700; color:var(--ink); margin-top:6px; font-family:var(--mono); }
.stat-card.lead{ background:var(--blue-deep); border-color:var(--blue-deep); }
.stat-card.lead .stat-label{ color:#AFC3E4; }
.stat-card.lead .stat-value{ color:#fff; }
@media (max-width:640px){ .stat-card{ flex:1 1 45%; } }
.bill-table{ border:1px solid var(--line); border-radius:10px; overflow:hidden; background:var(--paper); }
.bill-row{
  display:grid; grid-template-columns:1.15fr .9fr 1.3fr .85fr .65fr 1.05fr 1.05fr 1.05fr 20px;
  gap:14px; align-items:center; padding:17px 22px; border-bottom:1px solid var(--line-soft);
}
.bill-row:last-child{ border-bottom:none; }
.bill-row > div:not(:last-child){ border-right:1px solid var(--line-soft); }
.bill-row.hd{ font-size:11.5px; letter-spacing:.03em; color:var(--ink); font-weight:700; padding-top:13px; padding-bottom:13px; background:var(--blue-pale); border-bottom:2px solid var(--line); }
.bill-row.hd > div:not(:last-child){ border-right:1px solid var(--line); }
.bill-row.item{ cursor:pointer; }
.bill-row.item:hover{ background:var(--paper-2); }
.bill-row .beno{ font-family:var(--mono); font-weight:600; font-size:14.5px; }
.bill-row .badge{ display:inline-block; font-size:10.5px; color:var(--blue-deep); background:var(--blue-pale); border-radius:4px; padding:1px 6px; margin-top:3px; }
.bill-row .num{ font-family:var(--mono); text-align:right; }
.bill-row .chev{ color:var(--blue); text-align:right; font-size:16px; }
.bill-row .field .l{ display:none; }
@media (max-width:820px){
  .list-page{ width:100%; padding:28px 18px 60px; }
  .bill-row.hd{ display:none; }
  .bill-row.item{ grid-template-columns:1fr; gap:4px; padding:16px 18px; }
  .bill-row.item > div{ border-right:none; }
  .bill-row.item .field{ display:flex; justify-content:space-between; font-size:13.5px; }
  .bill-row.item .field .l{ display:inline; color:var(--ink-soft); }
  .bill-row.item .num{ text-align:right; }
}

/* ---------- detail page ---------- */
.app{ display:flex; min-height:calc(100vh - 71px); }
.rail{
  width:280px; flex:0 0 280px; border-right:1px solid var(--line);
  background:var(--paper-2); display:flex; flex-direction:column;
}
.back-btn{
  margin:16px 14px 0; text-align:left; border:1px solid var(--line); background:var(--paper);
  border-radius:6px; padding:9px 12px; cursor:pointer; color:var(--blue-deep); font-size:13.5px; font-weight:600;
}
.back-btn:hover{ background:var(--blue-pale); }
.current-bill{ padding:16px 18px 6px; border-bottom:1px solid var(--line); margin-top:4px; }
.current-bill .cb-no{ font-family:var(--mono); font-weight:600; font-size:15px; color:var(--ink); }
.current-bill .cb-port{ font-size:12.5px; color:var(--ink-soft); margin-top:2px; }
nav{ flex:1; overflow-y:auto; padding:6px 8px 18px; }
.part-label{ font-size:11px; letter-spacing:.06em; color:var(--ink-soft); font-weight:600; padding:14px 10px 4px; }
.sec-btn{
  display:block; width:100%; text-align:left; border:none; background:none;
  color:var(--ink); padding:7px 12px; border-radius:5px; cursor:pointer; font-size:14px;
}
.sec-btn:hover{ background:var(--blue-pale); }
.sec-btn.active{ background:var(--blue-deep); color:#fff; }
.inv-tabs{ display:flex; gap:4px; padding:4px 10px 8px; flex-wrap:wrap; }
.inv-tab{
  border:1px solid var(--line); background:var(--paper); color:var(--ink-soft);
  font-family:var(--mono); font-size:12px; padding:3px 8px; border-radius:4px; cursor:pointer;
}
.inv-tab.active{ border-color:var(--blue-deep); color:var(--blue-deep); font-weight:600; background:var(--blue-pale); }
main{ flex:1; min-width:0; padding:28px 40px 60px; max-width:920px; }
.crumb{ font-size:13px; color:var(--ink-soft); margin-bottom:6px; }
.crumb b{ color:var(--ink); font-weight:600; }
h2.title{ margin:0 0 2px; font-size:22px; font-weight:600; color:var(--ink); }
.sheet{ border:1px solid var(--line); border-radius:8px; background:var(--paper); overflow:hidden; }
.field-row{ display:flex; gap:18px; padding:11px 18px; border-bottom:1px solid var(--line-soft); align-items:baseline; }
.field-row:last-child{ border-bottom:none; }
.field-row .fno{ font-family:var(--mono); font-size:12px; color:var(--ink-soft); width:26px; flex:0 0 26px; }
.field-row .flabel{ width:190px; flex:0 0 190px; color:var(--ink-soft); font-size:13.5px; }
.field-row .fvalue{ flex:1; font-weight:500; word-break:break-word; }
.field-row.flash{ animation:flash 1.1s ease; }
@keyframes flash{ 0%{ background:var(--blue-pale);} 100%{ background:transparent;} }
.empty{ color:var(--ink-soft); font-style:italic; }
.note{ margin-top:16px; padding:12px 16px; border:1px dashed var(--line); border-radius:8px; color:var(--ink-soft); font-size:13.5px; }
table.items{ width:100%; border-collapse:collapse; font-size:13.5px; border:1px solid var(--line); }
table.items th{
  text-align:left; font-size:11.5px; letter-spacing:.03em; color:var(--ink); font-weight:700;
  border:1px solid var(--line); padding:9px 10px; position:sticky; top:0; background:var(--blue-pale);
}
table.items td{ padding:8px 10px; border:1px solid var(--line-soft); vertical-align:top; }
table.items tr.item-row{ cursor:pointer; }
table.items tr.item-row:hover{ background:var(--paper-2); }
table.items td.num{ text-align:right; font-family:var(--mono); white-space:nowrap; }
table.items td.cth{ font-family:var(--mono); color:var(--ink-soft); white-space:nowrap; }
.items-wrap{ max-height:560px; overflow:auto; border:1px solid var(--line); border-radius:8px; }
.item-detail{ margin-top:16px; border:1px solid var(--blue-deep); border-radius:8px; overflow:hidden; }
.item-detail .hd{ background:var(--blue-pale); padding:10px 16px; font-weight:600; display:flex; justify-content:space-between; }
.item-detail .hd button{ background:none; border:none; color:var(--ink-soft); cursor:pointer; font-size:13px; }
@media (max-width:760px){
  .app{ flex-direction:column; min-height:auto; }
  .rail{ width:100%; flex:none; }
  nav{ max-height:280px; }
  main{ padding:20px 16px 48px; }
  .field-row{ flex-wrap:wrap; }
  .field-row .flabel{ width:100%; }
}
</style>

    + '<div><div class="beno">'+d.boe.beNo+'</div><span class="badge">'+d.boe.copyType+'</span></div>'
    + '<div class="field"><span class="l">Date</span> '+d.boe.beDate+'</div>'
    + '<div class="field"><span class="l">Port</span> '+d.boe.port+'</div>'
    + '<div class="field"><span class="l">Origin</span> '+d.status.countryOfOrigin+'</div>'
    + '<div class="field"><span class="l">Mode</span> '+d.status.mode+'</div>'
    + '<div class="field"><span class="l">Invoices / items</span> '+d.boe.totalInvoices+' inv &middot; '+d.boe.totalItems+' items</div>'
    + '<div class="field num"><span class="l">Assessable value</span> '+fmt(d.dutySummary.totalAssessableValue)+'</div>'
    + '<div class="field num"><span class="l">Total duty</span> '+fmt(d.dutySummary.totalDuty)+'</div>'
    + '<div class="chev">&rsaquo;</div>'
    + '</div>';
}
function matchesSearch(key, q){
  if(!q) return true;
  const d = DOCS[key];
  const hay = [d.boe.beNo, d.boe.port, d.boe.portCode, d.boe.docType, d.status.countryOfOrigin,
    d.status.mode, d.declarant.importerName, d.declarant.cbName].join(" ").toLowerCase();
  return hay.indexOf(q) !== -1;
}
function renderBillTable(){
  const wrap = document.getElementById("billTableWrap");
  if(!wrap) return;
  const q = (state.search || "").trim().toLowerCase();
  const keys = Object.keys(DOCS).filter(function(k){ return matchesSearch(k, q); });
  const header = '<div class="bill-row hd"><div>BE No.</div><div>Date</div><div>Port</div><div>Origin</div><div>Mode</div>'
    + '<div>Invoices / items</div><div style="text-align:right">Assessable value</div><div style="text-align:right">Total duty</div><div></div></div>';
  if(keys.length === 0){
    wrap.innerHTML = '<div class="bill-table">' + header + '<div class="no-results">No bills match &ldquo;'+escapeHtml(state.search)+'&rdquo;.</div></div>';
    return;
  }
  wrap.innerHTML = '<div class="bill-table">' + header + keys.map(billRowHTML).join("") + '</div>';
}
function onSearchInput(v){ state.search = v; renderBillTable(); }

function listPageHTML(){
  const keys = Object.keys(DOCS);
  const totalItems = keys.reduce(function(sum,k){ return sum + DOCS[k].boe.totalItems; }, 0);
  const stats = '<div class="stats-strip">'
    + '<div class="stat-card lead"><div class="stat-label">Bills</div><div class="stat-value">'+keys.length+'</div></div>'
    + '<div class="stat-card"><div class="stat-label">Items across all bills</div><div class="stat-value">'+totalItems+'</div></div>'
    + '</div>';
  return '<div class="list-page">'
    + '<div class="list-header">'
    +   '<div class="title-block"><div class="title-accent"></div><h1>Indian Customs Bills</h1></div>'
    +   '<div class="search-bar">'
    +     '<svg viewBox="0 0 20 20" fill="none" xmlns="http://www.w3.org/2000/svg"><circle cx="9" cy="9" r="6.2" stroke="currentColor" stroke-width="1.6"/><path d="M13.6 13.6L17.5 17.5" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/></svg>'
    +     '<input type="text" id="billSearch" placeholder="Search by BE number, port, origin, mode, importer..." value="'+escapeHtml(state.search||"")+'" oninput="onSearchInput(this.value)">'
    +   '</div>'
    + '</div>'
    + stats
    + '<div id="billTableWrap"></div>'
    + '</div>';
}

/* ============================================================
   PAGE 2 — DETAIL (rail + main)
   ============================================================ */
function renderNav(){
  const el = document.getElementById("navTree");
  const doc = DOCS[state.doc];
  let html = "";
  NAV.forEach(function(p){
    html += '<div class="part-label">'+p.label+'</div>';
    if(p.part==="II"){
      html += '<div class="inv-tabs">' + doc.invoices.map(function(inv,i){
        const active = (state.invIdx===i && state.part==="II") ? "active" : "";
        return '<button class="inv-tab '+active+'" onclick="go(\'II\',\''+(state.part==="II"?state.section:"A")+'\',{invIdx:'+i+'})">Inv '+inv.sno+'/'+doc.invoices.length+'</button>';
      }).join("") + '</div>';
    }
    p.sections.forEach(function(sec){
      const active = state.part===p.part && state.section===sec.s;
      let extra = "";
      if(p.part==="II" && sec.s==="E"){ extra = ' ('+doc.invoices[state.invIdx].items.length+')'; }
      html += '<button class="sec-btn '+(active?"active":"")+'" onclick="go(\''+p.part+'\',\''+sec.s+'\')">'+sec.l+extra+'</button>';
    });
  });
  el.innerHTML = html;
}

function renderMain(){
  const doc = DOCS[state.doc];
  const main = document.getElementById("main");

  if(state.part==="I"){
    let body="", tag="";
    if(state.section==="A"){ tag="boe_status";
      body = row("1","BE status",doc.status.beStatus,"be_status") + row("2","Mode",doc.status.mode,"mode")
        + row("8","Assess",doc.status.assess,"assess") + row("9","Exam",doc.status.exam,"exam")
        + row("10","HSS",doc.status.hss,"hss") + row("12","Prov / Final",doc.status.provFinal,"prov_final")
        + row("13","Country of origin",doc.status.countryOfOrigin,"country_of_origin")
        + row("14","Country of consignment",doc.status.countryOfConsignment,"country_of_consignment")
        + row("15","Port of loading",doc.status.portOfLoading,"port_of_loading")
        + row("16","Port of shipment",doc.status.portOfShipment,"port_of_shipment");
    } else if(state.section==="B"){ tag="boe_declarant";
      body = row("1","Importer name",doc.declarant.importerName,"importer_name")
        + row("","Importer address",doc.declarant.importerAddress,"importer_address")
        + row("2","CB name",doc.declarant.cbName,"cb_name")
        + row("","AD code",doc.declarant.adCode,"ad_code");
    } else if(state.section==="C"){ tag="boe_duty_summary"; const s=doc.dutySummary;
      body = row("1","BCD",fmt(s.bcd),"bcd") + row("3","SWS",fmt(s.sws),"sws") + row("7","IGST",fmt(s.igst),"igst")
        + row("18","Total assessable value",fmt(s.totalAssessableValue),"total_assessable_value")
        + row("14","Total duty",fmt(s.totalDuty),"total_duty") + row("19","Total amount",fmt(s.totalAmount),"total_amount");
    } else if(state.section==="D"){ tag="boe_manifest"; const m=doc.manifest;
      body = row("6","MAWB no.",m.mawbNo,"mawb_no") + row("7","MAWB date",m.mawbDate,"mawb_date")
        + row("8","HAWB no.",m.hawbNo,"hawb_no") + row("9","HAWB date",m.hawbDate,"hawb_date")
        + row("10","Packages",m.packages,"packages") + row("11","Gross weight (kg)",m.grossWeightKg,"gross_weight_kg");
    } else if(state.section==="F"){ tag="boe_payment";
      body = doc.payments.map(function(p){ return row(p.srNo,"Challan "+p.challanNo,money(p.amount,"INR")+" &middot; paid "+p.paidOn,"amount"); }).join("");
    } else if(state.section==="H"){ tag="boe_processing_event";
      body = doc.events.map(function(e){ return row("",e.event,e.date+" &middot; "+e.time+" &middot; "+e.rate,"event_name / exchange_rate_text"); }).join("");
    } else if(state.section==="J"){ tag="boe_container";
      if(doc.containers.length===0){ body = row("","Containers","<span class='empty'>none declared (LCL / not containerised)</span>",""); }
      else body = doc.containers.map(function(c){ return row(c.sno,"Container "+c.containerNumber, c.lclFcl+" &middot; truck "+c.truck+" &middot; seal "+c.seal,"container_number"); }).join("");
    }
    const secLabel = NAV[0].sections.find(function(x){return x.s===state.section;}).l;
    main.innerHTML = crumb("I — Bill of Entry summary", secLabel)
      + '<h2 class="title">'+secLabel+'</h2><div class="sheet">'+body+'</div>';
    return;
  }

  if(state.part==="II"){
    const inv = doc.invoices[state.invIdx];
    const label = NAV[1].sections.find(function(x){return x.s===state.section;}).l;
    let tag="", body="";
    if(state.section==="A"){ tag="boe_invoice";
      body = row("1","Invoice no.",inv.no,"invoice_no") + row("","Invoice date",inv.date,"invoice_date")
        + row("","Invoice amount",money(inv.amount,inv.currency),"invoice_amount / currency_code");
    } else if(state.section==="B"){ tag="boe_invoice_party"; const p=inv.parties;
      body = row("1","Buyer",p.buyer,"role=BUYER") + row("2","Seller",p.seller,"role=SELLER")
        + row("3","Supplier",p.supplier,"role=SUPPLIER") + row("4","Third party",p.thirdParty,"role=THIRD_PARTY");
    } else if(state.section==="C"){ tag="boe_invoice_valuation"; const v=inv.valuation;
      body = row("1","Invoice value",money(v.invoiceValue,inv.currency),"invoice_value")
        + row("2","Freight",v.freight,"freight") + row("3","Insurance",v.insurance,"insurance")
        + row("7","Pay terms",v.payTerms,"pay_terms") + row("8","Valuation method",v.valuationMethod,"valuation_method")
        + row("9","Related party",v.relatedParty,"related_party_flag")
        + row("10","SVB channel",v.svbCh,"svb_ch") + row("11","SVB no.",v.svbNo,"svb_no")
        + row("15","Incoterm",v.incoterm,"incoterm");
    } else if(state.section==="D"){ tag="boe_invoice_cost_services"; const c=inv.cost;
      body = row("13","Misc. charge",fmt(c.miscCharge),"misc_charge") + row("14","Assessable value",fmt(c.assessValue),"assessable_value");
    } else if(state.section==="E"){ tag="boe_invoice_item";
      if(state.itemIdx!==null){
        const it = inv.items[state.itemIdx];
        const detail = '<div class="item-detail"><div class="hd">Item '+it[0]+' &middot; '+it[1]+'<button onclick="closeItem()">close &times;</button></div>'
          + row("2","CTH",it[1],"cth") + row("3","Description",it[2],"description")
          + row("4","Unit price",fmt(it[3]),"unit_price") + row("5","Quantity",it[4]+" "+it[5],"quantity / uqc")
          + row("7","Amount",fmt(it[6]),"amount")
          + '</div>'
          + '<div class="note">Part III duty assessment for this item (BCD / SWS / IGST / CAIDC breakdown) is not loaded in this demo — boe_item_duty is schema-ready but intentionally left empty rather than risk a mistranscribed figure from the source scan.</div>';
        main.innerHTML = crumb("II — Invoice & valuation", "Invoice "+inv.sno+"/"+doc.invoices.length+" &middot; "+label)
          + '<h2 class="title">Item '+it[0]+' of '+inv.items.length+'</h2>'+detail;
        return;
      }
      body = '<div class="items-wrap"><table class="items">'
        + '<thead><tr><th>#</th><th>CTH</th><th>Description</th><th>Unit price</th><th>Qty</th><th>Amount</th></tr></thead>'
        + '<tbody>' + inv.items.map(function(it,i){
            return '<tr class="item-row" onclick="openItem('+i+')">'
              + '<td>'+it[0]+'</td><td class="cth">'+it[1]+'</td><td>'+it[2]+'</td>'
              + '<td class="num">'+fmt(it[3])+'</td><td class="num">'+it[4]+' '+it[5]+'</td><td class="num">'+fmt(it[6])+'</td></tr>';
          }).join("") + '</tbody></table></div>';
      main.innerHTML = crumb("II — Invoice & valuation", "Invoice "+inv.sno+"/"+doc.invoices.length+" &middot; "+label)
        + '<h2 class="title">'+label+' — Invoice '+inv.sno+'/'+doc.invoices.length+'</h2>' + body;
      return;
    }
    main.innerHTML = crumb("II — Invoice & valuation", "Invoice "+inv.sno+"/"+doc.invoices.length+" &middot; "+label)
      + '<h2 class="title">'+label+' — Invoice '+inv.sno+'/'+doc.invoices.length+'</h2><div class="sheet">'+body+'</div>';
    return;
  }

  if(state.part==="IV"){
    const body = doc.supportingDocs.map(function(d){
      const scope = d.inv===0 ? "BOE level" : (d.item===0 ? "Invoice "+d.inv : "Invoice "+d.inv+" &middot; item "+d.item);
      return row(d.type,"IRN "+d.irn, scope+" &middot; "+d.place+" &middot; "+d.date, "doc_type_code / irn");
    }).join("");
    main.innerHTML = crumb("IV — Additional details","Supporting documents")
      + '<h2 class="title">Supporting documents</h2>'
      + '<div class="sheet">'+body+'</div>'
      + '<div class="note">Rows scoped to "Invoice N" (item = 0) are the case that needed the schema fix — a document attached to one invoice as a whole, not the whole BOE or a single item.</div>';
    return;
  }

  if(state.part==="VI"){
    if(state.section==="A"){
      const body = doc.declarations.map(function(d){ return row(d.for,"Declaration "+d.for, TXT[d.key], "declaration_for / declaration_text"); }).join("");
      main.innerHTML = crumb("VI — Declaration","Declaration statements")
        + '<h2 class="title">Declaration statements</h2><div class="sheet">'+body+'</div>';
    } else {
      const s = doc.signatory;
      main.innerHTML = crumb("VI — Declaration","Authorized signatory")
        + '<h2 class="title">Authorized signatory</h2>'
        + '<div class="sheet">'+row("","CHA name",s.chaName,"cha_name")+row("","Date",s.date,"signed_date")+row("","Place",s.place,"signed_place")+'</div>';
    }
    return;
  }
}

/* ============================================================
   ROOT RENDER
   ============================================================ */
function render(){
  const root = document.getElementById("root");
  if(state.page === "list"){
    root.innerHTML = listPageHTML();
    renderBillTable();
    return;
  }
  const doc = DOCS[state.doc];
  root.innerHTML = '<div class="app"><aside class="rail">'
    + '<button class="back-btn" onclick="backToList()">&larr; All bills</button>'
    + '<div class="current-bill"><div class="cb-no">'+doc.boe.beNo+'</div><div class="cb-port">'+doc.boe.portCode+' &middot; '+doc.boe.beDate+'</div></div>'
    + '<nav id="navTree"></nav>'
    + '</aside><main id="main"></main></div>';
  renderNav();
  renderMain();
}
render();
</script>
